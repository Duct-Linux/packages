name: publish repository

# Signs the repository index and uploads it. Split from the build workflow so
# the signing key is reachable from exactly one job, gated on a protected
# environment -- never from a pull request, and never from the build matrix.

on:
  workflow_run:
    workflows: ["build packages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Build run to publish artifacts from (required for a manual run)'
        required: false
      create_repo:
        description: 'Create a NEW repository index. Only for a genuinely empty server -- this makes anything already published unreferenced.'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # Two publishes racing would interleave their uploads and could leave the
  # server with an index that does not match its signature.
  group: publish-repository
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: release
    env:
      REPO_NAME: duct
      REPO_URL: https://repo.duct.dss-net.de
      # The FTP account is chrooted, so login already lands in the directory
      # Caddy serves as /srv/duct/repo. Paths are relative to that -- an
      # absolute /srv/duct/repo here would resolve to
      # /srv/duct/repo/srv/duct/repo inside the jail.
      REMOTE_DIR: .
      # A real multi-arch manifest now, so the runner architecture no longer
      # dictates the tag.
      BUILDER: ghcr.io/duct-linux/builder:latest

    steps:
      - uses: actions/checkout@v4

      # NOT actions/download-artifact. It reported "Found 200 artifact(s)" for a
      # run holding 258 and returned success, and the fifty-nine it dropped were
      # the oldest -- which in a level-ordered climb is the foundation. See
      # tools/collect-artefacts.sh for the full measurement; the script's job is
      # to assert the set is complete and FAIL if it is not.
      #
      # A manual run has no artefacts of its own -- github.run_id is this publish
      # run, which contains nothing. The build run has to be named.
      - name: Collect built packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./tools/collect-artefacts.sh \
            '${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}' incoming

      # RECONCILE, RATHER THAN REPLAY.
      #
      # A publish indexes only its TRIGGERING build's artefacts. The concurrency
      # group holds at most ONE pending run, so when merges land in quick
      # succession a newly arriving publish CANCELS THE ONE ALREADY QUEUED --
      # and a cancelled publish never indexes its build's packages, with nothing
      # anywhere that retries them.
      #
      # That is not hypothetical. Four PRs merged in fifty-five seconds one
      # afternoon; two publishes were cancelled while pending, and libksba and
      # libgcrypt were built, uploaded, and never indexed.
      #
      # The fix is to collect from every build whose publish MAY have been
      # cancelled, rather than to detect which ones were. A replay mechanism has
      # to notice that something did not happen, which is the category this
      # project fails at; reconciling a superset has to notice nothing.
      #
      # THE WINDOW IS SELF-LIMITING: everything that completed since the last
      # SUCCESSFUL publish. A successful publish moves the boundary forward, so
      # the set empties itself and never grows without bound. No "last N runs"
      # guess.
      #
      # Duplicates are free: the indexer below already skips any package whose
      # sha256 matches the index, so a re-collected artefact costs one hash.
      #
      # THIS IS A DIFFERENT DEFECT FROM THE TRUNCATION ABOVE and must not be
      # credited with covering it: that one drops artefacts WITHIN a single run,
      # this one drops entire runs BETWEEN publishes. A publish can suffer
      # either without the other. They share the collector precisely so the
      # completeness assertion applies to both -- reconcile's original
      # implementation used `gh run download --pattern`, which truncates the
      # same way and would have re-introduced the bug the moment it landed.
      - name: Collect artefacts whose publish may have been cancelled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # An aged run that has lost its artefacts is expected here, and must
          # not fail the publish -- otherwise one old run blocks every future
          # publish for ever. It is still reported loudly and by name.
          ALLOW_EXPIRED: '1'
        run: |
          set -euo pipefail
          mkdir -p incoming

          # The last publish that actually finished. Not this one -- it is still
          # running -- and not a cancelled one, which is the whole point.
          since=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=publish.yml \
                    --status success --limit 1 --json createdAt -q '.[0].createdAt' 2>/dev/null || true)
          if [ -z "$since" ]; then
            echo "::notice::no previous successful publish; nothing to reconcile"
            exit 0
          fi
          echo "reconciling builds completed since $since"

          # Successful main builds since then. jq does the comparison because
          # these are ISO-8601 and string ordering is correct for that format.
          runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=build.yml \
                   --branch main --status success --limit 50 \
                   --json databaseId,createdAt \
                   -q "[.[] | select(.createdAt > \"$since\") | .databaseId] | .[]" 2>/dev/null || true)

          trigger='${{ github.event.workflow_run.id || inputs.run_id || github.run_id }}'
          n=0
          for r in $runs; do
            # Already collected above.
            [ "$r" = "$trigger" ] && continue
            ./tools/collect-artefacts.sh "$r" incoming
            echo "  reconciled artefacts from run $r"
            n=$((n + 1))
          done
          echo "reconciled $n build run(s)"

      - name: Fetch the current index
        env:
          CREATE_REPO: ${{ inputs.create_repo }}
        run: |
          set -euo pipefail
          mkdir -p repo/packages
          # Only the index is fetched, not the packages: add-to-repo appends to
          # an existing repo.db, so previously published packages stay indexed
          # without moving 187 MB through the runner on every publish.
          # A MISSING INDEX IS AN ERROR, NOT A REASON TO MAKE A NEW ONE.
          #
          # This used to fall through to `tape-repo create-repo` on any failure
          # to fetch. That is correct exactly once in the life of the repository
          # and catastrophic every other time: a transient curl failure would
          # build a FRESH EMPTY index, add only this build's packages, SIGN it,
          # and upload it over the published one. Every other package on the
          # server becomes unreferenced in a single step -- the tarballs survive
          # and nothing points at them -- and the run goes green, because every
          # step did exactly what it was told.
          #
          # The legitimate trigger for that branch is permanently in the past.
          # It must not be reachable from a network error, so creating a
          # repository now requires someone to ask for it by name.
          #
          # Retrying would be the wrong fix: it lowers the probability of
          # reaching a branch that must never be reached by accident, and no
          # number of retries makes "the index is gone" a safe thing to assume.
          if curl -fsSL -o repo/repo.db "$REPO_URL/repo.db"; then
            echo "extending the published index ($(stat -c%s repo/repo.db) bytes)"
          elif [ "${CREATE_REPO:-false}" = "true" ]; then
            echo "::warning::creating a NEW repository index; anything already published becomes unreferenced"
            docker run --rm -v "$PWD/repo":/repo "$BUILDER" tape-repo create-repo /repo
          else
            echo "::error::could not fetch $REPO_URL/repo.db, and this workflow will not"
            echo "::error::replace a published index it cannot read. If the repository is"
            echo "::error::genuinely new, re-run with create_repo: true. Otherwise this is"
            echo "::error::a transport failure and publishing must not continue."
            exit 1
          fi

      - name: Index the new packages
        id: index
        run: |
          set -euo pipefail
          shopt -s nullglob
          new=(incoming/*.tape.tar.gz)
          # Not an error. A push that touches only a workflow selects no
          # packages, so there is genuinely nothing to publish -- failing there
          # would paint the run red for correct behaviour, and a publish that
          # cries wolf is one nobody reads.
          if [ ${#new[@]} -eq 0 ]; then
            echo "::notice::no packages were built; nothing to publish"
            echo "count=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          # WHY THIS CHECK EXISTS, STATED SO IT SURVIVES add-to-repo CHANGING:
          # add-to-repo KEYS ON IDENTITY -- (name, version, subversion, arch) --
          # AND NEVER LOOKS AT CONTENT. So it cannot detect a rebuild whose bytes
          # changed under an unchanged identity, AT ANY EXIT CODE. That is a
          # property of what it compares, not of what it returns.
          #
          # Said that way deliberately. This comment used to justify the check by
          # saying add-to-repo "logs an error, exits 0 and leaves the existing row
          # alone" -- and addToRepo.go has since been changed to exit 1, precisely
          # so a caller can tell a duplicate from a success. Nothing here broke,
          # because only the fresh set reaches add-to-repo and repairs are copied
          # without re-indexing. But anyone tidying up would have read the stale
          # sentence, checked the current exit code, concluded the workaround was
          # obsolete, and deleted THE ONLY THING THAT DETECTS A CHANGED REBUILD.
          # A justification that names an exit code expires when the exit code
          # changes; one that names what the code compares does not.
          #
          # Without the check the new bytes would be uploaded while the index kept
          # the old sha256, and every client would fail its digest check against a
          # file it is also told to cache for a year as immutable.
          #
          # A published filename means one set of bytes, forever -- that is what
          # lets the server serve it as immutable for a year. So anything
          # already in the index is left exactly as published and is not
          # re-uploaded, which also keeps a rebuild from pushing 187 MB of
          # identical files back over FTP.
          fresh=() repair=()
          for f in "${new[@]}"; do
            b=$(basename "$f")
            name=${b%-*-*.*.tape.tar.gz}
            rest=${b#"$name"-}; ver=${rest%%-*}
            rest=${rest#"$ver"-}; sub=${rest%%.*}
            arch=${b%.tape.tar.gz}; arch=${arch##*.}
            have=$(sqlite3 repo/repo.db \
              "select sha256 from packages where name='$name' and version='$ver' \
               and subversion='$sub' and arch='$arch' and deleted_at is null;" 2>/dev/null || true)
            if [ -z "$have" ]; then
              fresh+=("$f")
              continue
            fi
            got=$(sha256sum "$f" | cut -d' ' -f1)
            if [ "$have" = "$got" ]; then
              # Already indexed and identical -- but "indexed" is not "correctly
              # on the server". A truncated upload leaves a file the index
              # describes and nobody can install, and skipping it here means
              # nothing ever repairs it. Caught exactly that: findutils arrived
              # as 65536 bytes against an index that said 365768.
              want=$(sqlite3 repo/repo.db \
                "select size from packages where name='$name' and version='$ver' \
                 and subversion='$sub' and arch='$arch' and deleted_at is null;" 2>/dev/null || true)
              served=$(curl -fsSI "$REPO_URL/packages/$b" 2>/dev/null \
                       | awk -F': ' 'tolower($1)=="content-length"{print $2}' | tr -d '\r')
              if [ -n "$want" ] && [ "$served" != "$want" ]; then
                echo "::warning::$b on the server is $served bytes, index says $want; re-uploading"
                repair+=("$f")
              else
                echo "    unchanged: $b"
              fi
            else
              # Either the recipe changed without a subversion bump, or the
              # package is not reproducible. Both are worth knowing about and
              # neither is worth overwriting a published file for: the bytes
              # clients already cached stay authoritative, and a real change
              # reaches them by bumping subversion.
              # KNOWN TO FIRE ROUTINELY, WHICH LIMITS WHAT IT CAN BE USED FOR.
              # One publish log carried seven of these across four packages --
              # file, gettext and perl on both arches, uutils-coreutils on
              # aarch64. Those first three embed build paths and timestamps, so
              # the likelier reading is non-reproducibility rather than an
              # unbumped recipe -- meaning the warning fires on every rebuild of
              # them, for ever. A warning that always fires is noise, and noise
              # is where a REAL unbumped recipe change would hide. Do not read a
              # quiet log as "no unbumped changes"; that inference is not
              # available until the reproducibility question is settled
              # separately.
              echo "::warning::$b rebuilt with different content; keeping the published bytes." \
                   "If the change is intended, bump subversion in pkgs/$name/TAPEBUILD.toml."
            fi
          done

          # Repairs are uploaded even when there is nothing new to index.
          if [ ${#repair[@]} -gt 0 ]; then
            cp "${repair[@]}" repo/packages/
            echo "repaired=${#repair[@]}" >>"$GITHUB_OUTPUT"
          fi

          if [ ${#fresh[@]} -eq 0 ]; then
            if [ ${#repair[@]} -gt 0 ]; then
              echo "::notice::nothing new to index, but ${#repair[@]} damaged upload(s) to repair"
              echo "count=${#repair[@]}" >>"$GITHUB_OUTPUT"
              echo "index_changed=0" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::notice::every built package is already published; nothing to do"
            echo "count=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "index_changed=1" >>"$GITHUB_OUTPUT"
          echo "count=${#fresh[@]}" >>"$GITHUB_OUTPUT"

          cp "${fresh[@]}" repo/packages/
          for f in "${fresh[@]}"; do
            echo "==> $(basename "$f")"
            docker run --rm -v "$PWD/repo":/repo -v "$PWD/incoming":/in:ro \
              "$BUILDER" tape-repo add-to-repo /repo "/in/$(basename "$f")"
          done

      - name: Sign the index
        if: steps.index.outputs.count != '0'
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${{ secrets.DUCT_SIGNING_KEY }}" > signing.key
          chmod 600 signing.key
          # LoadPrivateKey refuses any key whose mode has group or other bits.
          docker run --rm -v "$PWD/repo":/repo -v "$PWD/signing.key":/key:ro \
            "$BUILDER" tape-repo sign-repo /repo /key --name "$REPO_NAME"
          test -s repo/repo.db.sig

      - name: Upload
        if: steps.index.outputs.count != '0'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # Order matters. Packages first: adding files nothing references yet
          # is harmless. Then the index and signature, written to temporary
          # names and renamed, so the window in which a client can see a fresh
          # index beside a stale signature is as short as the server can make
          # it. ftp:ssl-force is not optional -- plain FTP sends the password
          # in the clear.
          lftp -c "
            set ftp:ssl-force true;
            set ssl:verify-certificate true;
            set net:max-retries 3;
            open -u '$FTP_USER','$FTP_PASSWORD' '$FTP_HOST';
            mirror -R --only-newer --parallel=4 repo/packages/ $REMOTE_DIR/packages/;
            put repo/repo.db     -o $REMOTE_DIR/repo.db.new;
            put repo/repo.db.sig -o $REMOTE_DIR/repo.db.sig.new;
            mv $REMOTE_DIR/repo.db.new     $REMOTE_DIR/repo.db;
            mv $REMOTE_DIR/repo.db.sig.new $REMOTE_DIR/repo.db.sig;
          "

      # The index is a promise about what the server holds. Nothing checked that
      # the promise was kept, so a truncated upload sat there advertised at its
      # full size until an install failed on it. Every entry is checked here,
      # not just the ones this run touched.
      - name: Verify the server matches the index
        if: steps.index.outputs.count != '0'
        run: |
          set -euo pipefail
          bad=0 n=0
          while IFS='|' read -r f want; do
            [ -n "$f" ] || continue
            n=$((n+1))
            got=$(curl -fsSI "$REPO_URL/packages/$f" 2>/dev/null \
                  | awk -F': ' 'tolower($1)=="content-length"{print $2}' | tr -d '\r')
            if [ "$got" != "$want" ]; then
              echo "::error::$f is $got bytes on the server, index says $want"
              bad=$((bad+1))
            fi
          done < <(sqlite3 repo/repo.db \
            "select name||'-'||version||'-'||subversion||'.'||arch||'.tape.tar.gz'||'|'||size \
             from packages where deleted_at is null;")
          echo "checked $n packages against the index; $bad wrong"
          [ "$bad" -eq 0 ]

      - name: Always remove the key
        if: always()
        run: shred -u signing.key 2>/dev/null || rm -f signing.key

      # Proves the published repository actually works, from the outside, using
      # nothing but the public image and the committed client config.
      - name: Verify the published repository
        if: steps.index.outputs.count != '0'
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null "$REPO_URL/repo.db"
          curl -fsS -o /dev/null "$REPO_URL/repo.db.sig"

          # No trust store seeding any more: duct/base ships ca-certificates, so
          # this exercises the same path a user's machine would.
          docker run --rm \
            -v "$PWD/server/duct.toml":/etc/tape/repos/duct.toml:ro \
            -v "$PWD/server/duct.key.pub":/etc/tape/keys/b52682f595163139.pub:ro \
            ghcr.io/duct-linux/base:latest \
            /usr/bin/bash -c 'taped & sleep 2; tape install -y m4 && echo "install from the published repository succeeded"'
