name: build packages

# Packages are built inside duct/builder, which already contains the whole
# package set -- so unlike a from-scratch bootstrap, each package's dependencies
# are simply present and the builds are independent. That is what makes a
# per-package matrix possible here where the local Makefile needs an ordered
# loop.
#
# A newly bootstrapped architecture has no builder image yet (builder is
# assembled from published packages, and it has none), so its first pass runs
# in duct/chroot instead. See the select job.

on:
  push:
    branches: [main]
    paths:
      - 'pkgs/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'pkgs/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names, or "all"'
        default: 'all'
      arch:
        description: 'Architecture to build, or "all". Use this to avoid rebuilding an architecture whose packages are already published.'
        default: 'all'
        type: choice
        options: ['all', 'x86_64', 'aarch64']
  release:
    types: [published]

permissions:
  contents: read
  # duct/chroot is private, unlike the other images. A new architecture's first
  # build reads it, so both jobs authenticate rather than depending on someone
  # remembering to flip a visibility switch after each bootstrap.
  packages: read

jobs:
  # Which packages to build, as a JSON matrix.
  #
  # A push touching one recipe rebuilds only that recipe -- a typo fix has no
  # business recompiling gcc. But versions.env and _scripts/ are inputs to
  # *every* package, so a change to either forces the full set.
  select:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: pick
        run: |
          set -euo pipefail
          all() { ls pkgs | grep -v '^_scripts$' | grep -v '^versions.env$'; }

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] \
             && [ '${{ inputs.packages }}' != 'all' ]; then
            sel='${{ inputs.packages }}'
          elif [ '${{ github.event_name }}' = 'release' ] \
             || [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            sel=$(all)
          else
            changed=$(git diff --name-only HEAD^ HEAD -- pkgs/ || true)
            if grep -qE '^pkgs/(versions\.env|_scripts/)' <<<"$changed"; then
              echo "shared input changed; rebuilding everything"
              sel=$(all)
            else
              sel=$(sed -n 's|^pkgs/\([^/]*\)/.*|\1|p' <<<"$changed" | sort -u)
            fi
          fi

          echo "selected: $(tr '\n' ' ' <<<"$sel")"

          # Which architectures exist, discovered rather than assumed. This
          # picks up a new one the moment its bootstrap lands.
          #
          # duct/builder is preferred, but a freshly bootstrapped architecture
          # cannot have one: builder is assembled from published packages, and
          # there are no packages for it yet. duct/chroot breaks that circle --
          # it is the self-hosted LFS chapter 7 image the bootstrap produces,
          # it carries tape-builder and a full toolchain, and it is what built
          # the first architecture's packages before any builder existed.
          # Parallel arrays rather than an associative one: `declare -A` needs
          # bash 4, which the runners have but macOS does not, and this block is
          # worth being able to run locally before pushing it.
          # Empty on a push, which means every architecture.
          want='${{ inputs.arch }}'; want=${want:-all}
          [ "$want" = all ] || echo "restricted to $want"

          found=() imgs=()
          image_for() {
            i=0
            for a in "${found[@]}"; do
              [ "$a" = "$1" ] && { echo "${imgs[$i]}"; return; }
              i=$((i+1))
            done
          }
          for a in x86_64 aarch64; do
            [ "$want" = all ] || [ "$want" = "$a" ] || continue
            if docker manifest inspect "ghcr.io/duct-linux/builder:$a" >/dev/null 2>&1; then
              found+=("$a"); imgs+=("ghcr.io/duct-linux/builder:$a")
            elif docker manifest inspect "ghcr.io/duct-linux/chroot:$a" >/dev/null 2>&1; then
              found+=("$a"); imgs+=("ghcr.io/duct-linux/chroot:$a")
              echo "::notice::$a has no builder image yet; bootstrapping its packages in duct/chroot"
            else
              echo "::notice::no builder or chroot image for $a yet; skipping that architecture"
            fi
          done
          [ ${#found[@]} -gt 0 ] || { echo "::error::no build image for any architecture"; exit 1; }
          echo "architectures: ${found[*]}"

          runner_for() { [ "$1" = x86_64 ] && echo ubuntu-latest || echo ubuntu-24.04-arm; }

          # Each matrix entry names its own image by architecture tag, never
          # :latest. A job runs on an arch-specific runner, and :latest is a
          # manifest that only covers an architecture once that architecture has
          # been published -- pulling it on the other one fails with "no
          # matching manifest for linux/amd64". That exact failure has already
          # appeared three times here, in the build matrix, in build-any and in
          # publish. Naming the tag makes it unrepresentable.
          entries='[]'
          add() {
            entries=$(jq -c \
              --arg package "$1" --arg arch "$2" --arg runner "$3" --arg image "$4" \
              '. + [{package:$package, arch:$arch, runner:$runner, image:$image}]' <<<"$entries")
          }

          for p in $sel; do
            # Packages stamped "any" are byte-identical everywhere, so they are
            # built once; building per-arch would produce duplicates that
            # add-to-repo rejects. Read from pkg.env rather than a hardcoded
            # name, which silently mis-routed the next package added.
            if grep -qxE 'PKG_ARCH=any' "pkgs/$p/pkg.env" 2>/dev/null; then
              # "any" describes the package, not the machine: it still needs a
              # runner and an image that exist. Prefer x86_64 when available.
              a=${found[0]}
              for c in "${found[@]}"; do [ "$c" = x86_64 ] && a=x86_64; done
              add "$p" any "$(runner_for "$a")" "$(image_for "$a")"
              continue
            fi

            for a in "${found[@]}"; do
              # uutils-coreutils is Rust, and duct/builder has no cargo -- it
              # needs the one image that does, which is bootstrapped separately
              # and may not exist for every architecture.
              # Two packages need a language Duct does not build itself, each
              # in its own image: uutils is Rust, and go bootstraps from a
              # pinned Go. Both images are produced separately and may not
              # exist for every architecture yet.
              case $p in
                # uutils is Rust, and rustc builds with rustc: both need the
                # image carrying a Rust toolchain, not duct/builder.
                uutils-coreutils|rust) image=ghcr.io/duct-linux/rust:$a ;;
                # Likewise Go, which bootstraps from Go.
                go)                    image=ghcr.io/duct-linux/go:$a ;;
                # tape is compiled in duct/bootstrap. Built anywhere else the
                # recipe would copy that image's own /usr/bin/tape, republishing
                # the previous package as though it were a new build.
                tape)                  image=ghcr.io/duct-linux/bootstrap:$a ;;
                *)                     image=$(image_for "$a") ;;
              esac
              if ! docker manifest inspect "$image" >/dev/null 2>&1; then
                echo "::warning::$image does not exist; not building $p for $a"
                continue
              fi
              add "$p" "$a" "$(runner_for "$a")" "$image"
            done
          done

          echo "jobs=$entries" >>"$GITHUB_OUTPUT"
          jq -r '.[] | "  \(.package) [\(.arch)] in \(.image)"' <<<"$entries"

  build:
    needs: select
    if: needs.select.outputs.jobs != '[]'
    strategy:
      fail-fast: false
      # Fully resolved by the select job: package, architecture, runner and the
      # exact image tag, each already checked to exist. One job shape covers
      # both per-architecture and "any" packages.
      matrix:
        include: ${{ fromJSON(needs.select.outputs.jobs) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      # Fetched here, not in the container: the build images have no curl or
      # wget, on purpose. Verified against the pinned sha256 before it is ever
      # mounted.
      - name: Fetch source
        run: DUCT_SRC_CACHE="$PWD/sources" ./tools/fetch-source.sh '${{ matrix.package }}'

      # A bootstrapping architecture builds in duct/chroot, which carries the
      # LFS chapter 7 temporary tools and nothing else -- not the Duct package
      # set. duct/builder does carry it, which is why the per-package matrix
      # normally needs no dependency handling at all: everything a recipe needs
      # is already installed.
      #
      # In chroot it is not, and the failures are exactly what that predicts --
      # binutils wanting zlib.h, mpfr and mpc wanting gmp.h, gcc wanting all
      # three. So the already-published packages for this architecture are
      # unpacked over the image first, which is the same "everything built so
      # far" step the local Makefile performs for a from-scratch bootstrap.
      #
      # This is inherently iterative: a package can only be seeded once it has
      # been published, so a bootstrap takes as many rounds as its dependency
      # chain is deep (zlib and gmp, then mpfr and mpc, then gcc).
      - name: Seed published dependencies
        if: contains(matrix.image, '/chroot:')
        env:
          REPO_URL: https://repo.duct.dss-net.de
        run: |
          set -euo pipefail
          mkdir -p deps
          if ! curl -fsSL -o repo.db "$REPO_URL/repo.db"; then
            echo "::notice::no published index yet; building against the bare chroot"
            exit 0
          fi
          files=$(sqlite3 repo.db \
            "select name||'-'||version||'-'||subversion||'.'||arch||'.tape.tar.gz' \
             from packages where arch in ('${{ matrix.arch }}','any') and deleted_at is null;")
          [ -n "$files" ] || { echo "::notice::nothing published for ${{ matrix.arch }} yet"; exit 0; }
          n=0
          for f in $files; do
            # The package being built is deliberately not seeded: it would be
            # the previous build of the very thing under test.
            case $f in ${{ matrix.package }}-*) continue ;; esac
            curl -fsSL -o pkg.tar.gz "$REPO_URL/packages/$f"
            rm -rf one && mkdir one
            tar xzf pkg.tar.gz -C one
            # Merge rather than replace: each package owns a disjoint set of
            # paths, so the union is the installed system.
            cp -a one/install/. deps/
            n=$((n+1))
          done
          rm -rf pkg.tar.gz one
          echo "seeded $n published packages"

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p out sources deps

          # "any" is a target tape understands; every other value is a triple.
          target='${{ matrix.arch }}'
          [ "$target" = any ] || target="$target-linux-gnu"
          echo "building ${{ matrix.package }} for $target in ${{ matrix.image }}"

          # --entrypoint: duct/bootstrap runs tape-builder as its entrypoint, so
          # "bash -c ..." arrives as arguments to it -- "unknown command bash
          # for tape-builder". Every image here has /bin/bash; the Duct ones
          # reach it through the /bin -> usr/bin symlink.
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD/pkgs":/pkgs:ro \
            -v "$PWD/out":/out \
            -v "$PWD/sources":/cache:ro \
            -v "$PWD/deps":/deps:ro \
            -e DUCT_SRC_CACHE=/cache \
            -e DUCT_JOBS="$(nproc)" \
            '${{ matrix.image }}' \
            -c "[ -d /deps/usr ] && cp -a /deps/. / ; cp -R /pkgs /tmp/pkgs && exec tape-builder build /tmp/pkgs/${{ matrix.package }} -t $target -o /out"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package }}-${{ matrix.arch }}
          path: out/*.tape.tar.gz
          if-no-files-found: error
          retention-days: 7
