name: build packages

# Every package is built inside duct/builder, which already contains the whole
# package set -- so unlike a from-scratch bootstrap, each package's dependencies
# are simply present and the builds are independent. That is what makes a
# per-package matrix possible here where the local Makefile needs an ordered
# loop.

on:
  push:
    branches: [main]
    paths:
      - 'pkgs/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'pkgs/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names, or "all"'
        default: 'all'
  release:
    types: [published]

permissions:
  contents: read

env:
  BUILDER: ghcr.io/duct-linux/builder:latest
  RUST_BUILDER: ghcr.io/duct-linux/rust:latest

jobs:
  # Which packages to build, as a JSON matrix.
  #
  # A push touching one recipe rebuilds only that recipe -- a typo fix has no
  # business recompiling gcc. But versions.env and _scripts/ are inputs to
  # *every* package, so a change to either forces the full set.
  select:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
      any_packages: ${{ steps.pick.outputs.any_packages }}
      arches: ${{ steps.arches.outputs.arches }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: pick
        run: |
          set -euo pipefail
          all() { ls pkgs | grep -v '^_scripts$' | grep -v '^versions.env$'; }

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] \
             && [ '${{ inputs.packages }}' != 'all' ]; then
            sel='${{ inputs.packages }}'
          elif [ '${{ github.event_name }}' = 'release' ] \
             || [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            sel=$(all)
          else
            changed=$(git diff --name-only HEAD^ HEAD -- pkgs/ || true)
            if grep -qE '^pkgs/(versions\.env|_scripts/)' <<<"$changed"; then
              echo "shared input changed; rebuilding everything"
              sel=$(all)
            else
              sel=$(sed -n 's|^pkgs/\([^/]*\)/.*|\1|p' <<<"$changed" | sort -u)
            fi
          fi

          # Packages stamped "any" are byte-identical on every architecture.
          # Building one per-arch would produce duplicates that add-to-repo
          # rejects, so they get their own single-lane job.
          #
          # Read from each recipe's pkg.env rather than listed here: the name
          # was hardcoded when duct-filesystem was the only such package, which
          # silently mis-routes the next one added.
          arch_pkgs=""; any_pkgs=""
          for p in $sel; do
            if grep -qxE 'PKG_ARCH=any' "pkgs/$p/pkg.env" 2>/dev/null; then
              any_pkgs="${any_pkgs}${p}"$'\n'
            else
              arch_pkgs="${arch_pkgs}${p}"$'\n'
            fi
          done

          echo "packages=$(jq -cRn '[inputs|select(length>0)]' <<<"$arch_pkgs")" >>"$GITHUB_OUTPUT"
          echo "any_packages=$(jq -cRn '[inputs|select(length>0)]' <<<"$any_pkgs")" >>"$GITHUB_OUTPUT"
          echo "selected: $(tr '\n' ' ' <<<"$sel")"

      # Which architectures can actually be built, discovered rather than
      # assumed: an architecture exists once its bootstrap has published a
      # builder image, and a matrix entry for one that has not would fail on a
      # missing manifest. This picks up a new architecture the moment its
      # bootstrap lands, with no edit here.
      - id: arches
        run: |
          set -euo pipefail
          found=()
          for a in x86_64 aarch64; do
            if docker manifest inspect "ghcr.io/duct-linux/builder:$a" >/dev/null 2>&1; then
              found+=("$a")
            else
              echo "::notice::no builder image for $a yet; skipping that architecture"
            fi
          done
          [ ${#found[@]} -gt 0 ] || { echo "::error::no builder image for any architecture"; exit 1; }
          printf 'arches=%s\n' "$(printf '%s\n' "${found[@]}" | jq -cRn '[inputs]')" >>"$GITHUB_OUTPUT"
          echo "building for: ${found[*]}"

  build:
    needs: select
    if: needs.select.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.packages) }}
        arch: ${{ fromJSON(needs.select.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      # Fetched here, not in the container: duct/builder has no curl or wget,
      # on purpose. Verified against the sha256 in versions.env before it is
      # ever mounted.
      - name: Fetch source
        run: DUCT_SRC_CACHE="$PWD/sources" ./tools/fetch-source.sh '${{ matrix.package }}'

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p out sources

          # uutils-coreutils is Rust, and duct/builder has no cargo -- it needs
          # the one image that does. Everything else builds in duct/builder,
          # where its dependencies are already installed.
          image=$BUILDER
          case '${{ matrix.package }}' in
            uutils-coreutils) image=$RUST_BUILDER ;;
          esac
          echo "building in $image"

          docker run --rm \
            -v "$PWD/pkgs":/pkgs:ro \
            -v "$PWD/out":/out \
            -v "$PWD/sources":/cache:ro \
            -e DUCT_SRC_CACHE=/cache \
            -e DUCT_JOBS="$(nproc)" \
            "$image" \
            bash -c 'cp -R /pkgs /tmp/pkgs && exec tape-builder build /tmp/pkgs/${{ matrix.package }} -t ${{ matrix.arch }}-linux-gnu -o /out'
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package }}-${{ matrix.arch }}
          path: out/*.tape.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Architecture-independent packages, built once.
  #
  # The runner still has to match an architecture that has a builder image:
  # "any" describes the package, not the machine that builds it, and pulling an
  # arm64-only builder onto an amd64 runner fails on a missing manifest. Prefer
  # x86_64 when it exists, otherwise use whatever does.
  build-any:
    needs: select
    if: needs.select.outputs.any_packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.select.outputs.any_packages) }}
    runs-on: ${{ contains(fromJSON(needs.select.outputs.arches), 'x86_64') && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source
        run: DUCT_SRC_CACHE="$PWD/sources" ./tools/fetch-source.sh '${{ matrix.package }}'
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p out sources
          docker run --rm \
            -v "$PWD/pkgs":/pkgs:ro -v "$PWD/out":/out -v "$PWD/sources":/cache:ro \
            -e DUCT_SRC_CACHE=/cache -e DUCT_JOBS="$(nproc)" \
            "$BUILDER" \
            bash -c 'cp -R /pkgs /tmp/pkgs && exec tape-builder build /tmp/pkgs/${{ matrix.package }} -t any -o /out'
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package }}-any
          path: out/*.tape.tar.gz
          if-no-files-found: error
          retention-days: 7
