name: build packages

# Packages are built inside duct/builder, which already contains the whole
# package set -- so unlike a from-scratch bootstrap, each package's dependencies
# are simply present and the builds are independent. That is what makes a
# per-package matrix possible here where the local Makefile needs an ordered
# loop.
#
# A newly bootstrapped architecture has no builder image yet (builder is
# assembled from published packages, and it has none), so its first pass runs
# in duct/chroot instead. See the select job.

on:
  push:
    branches: [main]
    paths:
      - 'pkgs/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'pkgs/**'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated package names, or "all"'
        default: 'all'
      arch:
        description: 'Architecture to build, or "all". Use this to avoid rebuilding an architecture whose packages are already published.'
        default: 'all'
        type: choice
        options: ['all', 'x86_64', 'aarch64']
  release:
    types: [published]

permissions:
  contents: read
  # duct/chroot is private, unlike the other images. A new architecture's first
  # build reads it, so both jobs authenticate rather than depending on someone
  # remembering to flip a visibility switch after each bootstrap.
  packages: read

jobs:
  # Which packages to build, as a JSON matrix.
  #
  # A push touching one recipe rebuilds only that recipe -- a typo fix has no
  # business recompiling gcc. But versions.env and _scripts/ are inputs to
  # *every* package, so a change to either forces the full set.
  select:
    runs-on: ubuntu-latest
    outputs:
      # The whole matrix, kept because it is what the log prints and what any
      # future job wanting "everything selected" should read.
      jobs: ${{ steps.pick.outputs.jobs }}
      # The same matrix partitioned by dependency level. Declared one by one
      # because a workflow's outputs cannot be generated any more than its jobs
      # can.
      level0: ${{ steps.pick.outputs.level0 }}
      level1: ${{ steps.pick.outputs.level1 }}
      level2: ${{ steps.pick.outputs.level2 }}
      level3: ${{ steps.pick.outputs.level3 }}
      level4: ${{ steps.pick.outputs.level4 }}
      level5: ${{ steps.pick.outputs.level5 }}
      level6: ${{ steps.pick.outputs.level6 }}
      level7: ${{ steps.pick.outputs.level7 }}
      level8: ${{ steps.pick.outputs.level8 }}
      level9: ${{ steps.pick.outputs.level9 }}
      level10: ${{ steps.pick.outputs.level10 }}
      level11: ${{ steps.pick.outputs.level11 }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Validate the recipes before deciding what to build, so a malformed one
      # fails in seconds rather than after an hour of compiling.
      #
      # Guarded on the script existing because it arrives in a different
      # change; this file should not depend on the order those two land in.
      - name: Check recipes
        run: |
          if [ -x tools/check-recipes.sh ]; then
            ./tools/check-recipes.sh
          else
            echo "::notice::tools/check-recipes.sh is not present; skipping recipe validation"
          fi

      - id: pick
        run: |
          set -euo pipefail
          all() { ls pkgs | grep -v '^_scripts$' | grep -v '^versions.env$'; }

          if [ '${{ github.event_name }}' = 'workflow_dispatch' ] \
             && [ '${{ inputs.packages }}' != 'all' ]; then
            sel='${{ inputs.packages }}'
          elif [ '${{ github.event_name }}' = 'release' ] \
             || [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            sel=$(all)
          else
            changed=$(git diff --name-only HEAD^ HEAD -- pkgs/ || true)
            if grep -qE '^pkgs/(versions\.env|_scripts/)' <<<"$changed"; then
              echo "shared input changed; rebuilding everything"
              sel=$(all)
            else
              sel=$(sed -n 's|^pkgs/\([^/]*\)/.*|\1|p' <<<"$changed" | sort -u)
            fi
          fi

          echo "selected: $(tr '\n' ' ' <<<"$sel")"

          # Which architectures exist, discovered rather than assumed. This
          # picks up a new one the moment its bootstrap lands.
          #
          # duct/builder is preferred, but a freshly bootstrapped architecture
          # cannot have one: builder is assembled from published packages, and
          # there are no packages for it yet. duct/chroot breaks that circle --
          # it is the self-hosted LFS chapter 7 image the bootstrap produces,
          # it carries tape-builder and a full toolchain, and it is what built
          # the first architecture's packages before any builder existed.
          # Parallel arrays rather than an associative one: `declare -A` needs
          # bash 4, which the runners have but macOS does not, and this block is
          # worth being able to run locally before pushing it.
          # Empty on a push, which means every architecture.
          want='${{ inputs.arch }}'; want=${want:-all}
          [ "$want" = all ] || echo "restricted to $want"

          found=() imgs=()
          image_for() {
            i=0
            for a in "${found[@]}"; do
              [ "$a" = "$1" ] && { echo "${imgs[$i]}"; return; }
              i=$((i+1))
            done
          }
          for a in x86_64 aarch64; do
            [ "$want" = all ] || [ "$want" = "$a" ] || continue
            if docker manifest inspect "ghcr.io/duct-linux/builder:$a" >/dev/null 2>&1; then
              found+=("$a"); imgs+=("ghcr.io/duct-linux/builder:$a")
            elif docker manifest inspect "ghcr.io/duct-linux/chroot:$a" >/dev/null 2>&1; then
              found+=("$a"); imgs+=("ghcr.io/duct-linux/chroot:$a")
              echo "::notice::$a has no builder image yet; bootstrapping its packages in duct/chroot"
            else
              echo "::notice::no builder or chroot image for $a yet; skipping that architecture"
            fi
          done
          [ ${#found[@]} -gt 0 ] || { echo "::error::no build image for any architecture"; exit 1; }
          echo "architectures: ${found[*]}"

          runner_for() { [ "$1" = x86_64 ] && echo ubuntu-latest || echo ubuntu-24.04-arm; }

          # Each matrix entry names its own image by architecture tag, never
          # :latest. A job runs on an arch-specific runner, and :latest is a
          # manifest that only covers an architecture once that architecture has
          # been published -- pulling it on the other one fails with "no
          # matching manifest for linux/amd64". That exact failure has already
          # appeared three times here, in the build matrix, in build-any and in
          # publish. Naming the tag makes it unrepresentable.
          entries='[]'
          # seed_arch is the fifth field and it is not a duplicate of arch.
          #
          # arch is what the PACKAGE is stamped for. seed_arch is what the
          # MACHINE running the build is. They differ for exactly one case, and
          # that case broke: an "any" package is architecture-independent in its
          # output, but its build still runs on a real runner and still needs
          # real dependencies for that runner's architecture. Seeding it with
          # "any" artifacts alone gives it nothing at all.
          add() {
            entries=$(jq -c \
              --arg package "$1" --arg arch "$2" --arg runner "$3" --arg image "$4" \
              --arg seed_arch "$5" \
              '. + [{package:$package, arch:$arch, runner:$runner, image:$image, seed_arch:$seed_arch}]' <<<"$entries")
          }

          for p in $sel; do
            # Packages stamped "any" are byte-identical everywhere, so they are
            # built once; building per-arch would produce duplicates that
            # add-to-repo rejects. Read from pkg.env rather than a hardcoded
            # name, which silently mis-routed the next package added.
            if grep -qxE 'PKG_ARCH=any' "pkgs/$p/pkg.env" 2>/dev/null; then
              # "any" describes the package, not the machine: it still needs a
              # runner and an image that exist. Prefer x86_64 when available.
              a=${found[0]}
              for c in "${found[@]}"; do [ "$c" = x86_64 ] && a=x86_64; done
              # Stamped "any", but built on $a's runner -- so it seeds $a.
              add "$p" any "$(runner_for "$a")" "$(image_for "$a")" "$a"
              continue
            fi

            for a in "${found[@]}"; do
              # uutils-coreutils is Rust, and duct/builder has no cargo -- it
              # needs the one image that does, which is bootstrapped separately
              # and may not exist for every architecture.
              # Two packages need a language Duct does not build itself, each
              # in its own image: uutils is Rust, and go bootstraps from a
              # pinned Go. Both images are produced separately and may not
              # exist for every architecture yet.
              case $p in
                # uutils is Rust, and rustc builds with rustc: both need the
                # image carrying a Rust toolchain, not duct/builder.
                uutils-coreutils|rust) image=ghcr.io/duct-linux/rust:$a ;;
                # Likewise Go, which bootstraps from Go.
                go)                    image=ghcr.io/duct-linux/go:$a ;;
                # tape is compiled in duct/bootstrap. Built anywhere else the
                # recipe would copy that image's own /usr/bin/tape, republishing
                # the previous package as though it were a new build.
                tape)                  image=ghcr.io/duct-linux/bootstrap:$a ;;
                *)                     image=$(image_for "$a") ;;
              esac
              if ! docker manifest inspect "$image" >/dev/null 2>&1; then
                echo "::warning::$image does not exist; not building $p for $a"
                continue
              fi
              add "$p" "$a" "$(runner_for "$a")" "$image" "$a"
            done
          done

          echo "jobs=$entries" >>"$GITHUB_OUTPUT"
          jq -r '.[] | "  \(.package) [\(.arch)] in \(.image)"' <<<"$entries"

          # Partition the matrix into dependency levels.
          #
          # Each job builds in the published builder image, which contains the
          # package set as of the last publish. That is enough until one change
          # adds two packages where the second needs the first -- and then the
          # second fails on something the first would have provided, and the
          # only way through is to merge, publish, and run again. One publish
          # round per layer of the graph, which a tiered package set makes
          # unworkable.
          #
          # Levels remove that: level 0 needs nothing else in this run, level N
          # needs only levels below it, and build.yml runs them in order. See
          # tools/dep-levels.sh.
          levels=$(./tools/dep-levels.sh $sel)
          echo "levels:"
          sort -k2 -n <<<"$levels" | sed 's/^/  /'

          deepest=$(awk '{ if ($2 > m) m = $2 } END { print m + 0 }' <<<"$levels")

          # A fixed number of level jobs, because a workflow cannot generate
          # jobs dynamically. MAX_LEVEL is 11 rather than the 7 the current
          # recipe set actually reaches -- rust sits at 7, through
          # cmake/ninja -> gcc -> binutils -> zlib -> glibc -- so a set that
          # merely matched today's depth would break on the next package that
          # deepened the graph by one.
          #
          # Exceeding it is a loud failure telling you to add a level, never a
          # silently wrong build order.
          max_level=11
          if [ "$deepest" -gt "$max_level" ]; then
            echo "::error::dependency graph is $deepest deep; build.yml only has $((max_level + 1)) levels. Add level jobs."
            exit 1
          fi
          echo "deepest level: $deepest (of $max_level available)"

          # jq builds each level's matrix from the entries already resolved
          # above, so a level inherits the architecture, runner and image
          # decisions rather than repeating them.
          lvlmap=$(awk '{ printf "{\"%s\":%s}\n", $1, $2 }' <<<"$levels" | jq -s 'add // {}')
          for L in $(seq 0 "$max_level"); do
            sub=$(jq -c --argjson m "$lvlmap" --argjson L "$L" \
              '[ .[] | select(($m[.package] // 0) == $L) ]' <<<"$entries")
            echo "level$L=$sub" >>"$GITHUB_OUTPUT"
            count=$(jq 'length' <<<"$sub")
            [ "$count" -gt 0 ] && echo "  level $L: $count job(s)"
          done
          true

  # One job per level, each waiting on the one below it.
  #
  # Twelve near-identical blocks is not elegant, and it is the only way a
  # GitHub workflow can express "N waves" -- jobs cannot be generated. The
  # steps live in build-level.yml so they exist once; what repeats here is the
  # wiring, and the wiring is the part that has to be explicit anyway.
  #
  # An empty level skips itself through the `if`, so a one-package change still
  # runs exactly one job.
  # One job per level, each waiting on EVERY level below it.
  #
  # `needs: [select, level0, level1, ... levelN-1]` rather than just the
  # previous level, and the verbosity is the point. `needs.*.result` only sees
  # DIRECT needs, so a chain of single needs propagates failure exactly one
  # hop: level0 fails, level1 correctly skips -- and level2, whose only lower
  # need is a level1 that is 'skipped' rather than 'failed', sees no failure
  # and runs anyway, on top of a level that produced nothing.
  #
  # That turns one clear failure into a cascade of confusing ones at every
  # level above it, which is precisely the "failures that look like recipe
  # bugs" outcome this whole change exists to prevent.
  #
  # An empty level skips itself through the `if`, so a one-package change still
  # runs exactly one job.

  level0:
    needs: [select]
    if: needs.select.outputs.level0 != '[]'
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level0 }}", level: '0' }
    secrets: inherit

  level1:
    needs: [select, level0]
    if: always() && needs.select.outputs.level1 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level1 }}", level: '1' }
    secrets: inherit

  level2:
    needs: [select, level0, level1]
    if: always() && needs.select.outputs.level2 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level2 }}", level: '2' }
    secrets: inherit

  level3:
    needs: [select, level0, level1, level2]
    if: always() && needs.select.outputs.level3 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level3 }}", level: '3' }
    secrets: inherit

  level4:
    needs: [select, level0, level1, level2, level3]
    if: always() && needs.select.outputs.level4 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level4 }}", level: '4' }
    secrets: inherit

  level5:
    needs: [select, level0, level1, level2, level3, level4]
    if: always() && needs.select.outputs.level5 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level5 }}", level: '5' }
    secrets: inherit

  level6:
    needs: [select, level0, level1, level2, level3, level4, level5]
    if: always() && needs.select.outputs.level6 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level6 }}", level: '6' }
    secrets: inherit

  level7:
    needs: [select, level0, level1, level2, level3, level4, level5, level6]
    if: always() && needs.select.outputs.level7 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level7 }}", level: '7' }
    secrets: inherit

  level8:
    needs: [select, level0, level1, level2, level3, level4, level5, level6, level7]
    if: always() && needs.select.outputs.level8 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level8 }}", level: '8' }
    secrets: inherit

  level9:
    needs: [select, level0, level1, level2, level3, level4, level5, level6, level7, level8]
    if: always() && needs.select.outputs.level9 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level9 }}", level: '9' }
    secrets: inherit

  level10:
    needs: [select, level0, level1, level2, level3, level4, level5, level6, level7, level8, level9]
    if: always() && needs.select.outputs.level10 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level10 }}", level: '10' }
    secrets: inherit

  level11:
    needs: [select, level0, level1, level2, level3, level4, level5, level6, level7, level8, level9, level10]
    if: always() && needs.select.outputs.level11 != '[]' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    uses: ./.github/workflows/build-level.yml
    with: { jobs: "${{ needs.select.outputs.level11 }}", level: '11' }
    secrets: inherit
