name: build one level

# One wave of the package build. Called by build.yml once per dependency level.
#
# This is a reusable workflow rather than twelve copies of the same job,
# because that is exactly what it would otherwise be: the steps do not vary
# between levels, only the matrix does.
#
# The ordering property that makes levels work lives in the caller -- each
# level job `needs:` the one below it -- and the *sharing* property lives here,
# in the artifact download: by the time a level runs, every lower level has
# finished and uploaded its packages, so downloading every `pkg-*` artifact in
# the run yields precisely "everything built so far". No per-package `needs:`
# wiring, and nothing to keep in step with the recipes.

on:
  workflow_call:
    inputs:
      jobs:
        description: 'JSON matrix for this level, from the select job'
        required: true
        type: string
      level:
        description: 'Level number, for log lines'
        required: true
        type: string
      timeout-minutes:
        description: >-
          Per-job timeout. GitHub kills a job at 6 hours with no useful signal;
          a deliberate limit below that fails loudly and early instead.
        required: false
        default: 300
        type: number

permissions:
  contents: read
  # duct/chroot is private, unlike the other images.
  packages: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.jobs) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v4

      # Fetched here, not in the container: the build images have no curl or
      # wget, on purpose. Verified against the pinned sha256 before it is ever
      # mounted.
      - name: Fetch source
        run: DUCT_SRC_CACHE="$PWD/sources" ./tools/fetch-source.sh '${{ matrix.package }}'

      # Everything already published for this architecture, unpacked over the
      # image before the build.
      #
      # This used to run only for duct/chroot, on the reasoning that duct/builder
      # already carries the whole package set. It does -- the set as of the last
      # time that image was *published*. A builder image that predates a
      # dependency then fails to build against it for no reason the recipe can
      # express, which is how `elfutils` came to fail on a missing pkg-config
      # that this repository has packaged for months. Seeding costs a download
      # and removes a whole class of stale-image failure.
      - name: Seed published packages
        env:
          REPO_URL: https://repo.duct.dss-net.de
        run: |
          set -euo pipefail
          mkdir -p deps
          if ! curl -fsSL -o repo.db "$REPO_URL/repo.db"; then
            echo "::notice::no published index yet; building against the bare image"
            exit 0
          fi
          files=$(sqlite3 repo.db \
            "select name||'-'||version||'-'||subversion||'.'||arch||'.tape.tar.gz' \
             from packages where arch in ('${{ matrix.arch }}','any') and deleted_at is null;")
          [ -n "$files" ] || { echo "::notice::nothing published for ${{ matrix.arch }} yet"; exit 0; }
          n=0
          for f in $files; do
            # The package being built is deliberately not seeded: it would be
            # the previous build of the very thing under test.
            case $f in ${{ matrix.package }}-*) continue ;; esac
            curl -fsSL -o pkg.tar.gz "$REPO_URL/packages/$f" || continue
            # tar straight into deps/, rather than unpacking to a scratch
            # directory and `cp -a`-ing the result over.
            #
            # The `cp -a` is what this used to do, and the first time it ever
            # ran against a real published repository it failed:
            #
            #   cp: cannot create regular file 'deps/./usr/bin/bashbug':
            #       Permission denied
            #
            # `cp -a` preserves directory modes as it goes, so a package
            # shipping a directory without a write bit makes every later
            # package unable to write into it. tar sets directory permissions
            # after extracting their contents, so the same set unpacks in any
            # order.
            #
            # The three flags each disarm one way this can go wrong:
            #   --keep-directory-symlink  Duct is merged-/usr, so
            #     duct-filesystem ships /lib as a symlink to usr/lib and other
            #     packages ship real paths beneath it. Without this, tar
            #     replaces the symlink with a directory and the tree splits in
            #     two.
            #   --no-same-permissions     deps/ is a build-time seed, not a
            #     shipped artifact. It has to be readable by the compiler; it
            #     does not have to reproduce a package's exact modes, and
            #     insisting on them is what caused the failure above.
            #   --no-same-owner           the runner is not root and cannot
            #     restore uid 0 anyway.
            tar xzf pkg.tar.gz -C deps --strip-components=1 \
              --keep-directory-symlink --no-same-permissions --no-same-owner install \
              || { echo "::warning::could not unpack $f; skipping"; continue; }
            n=$((n+1))
          done
          rm -f pkg.tar.gz
          echo "seeded $n published packages"

      # Everything built earlier in *this* run, unpacked on top of the published
      # set so a package under review wins over its published predecessor.
      #
      # pattern + merge-multiple is the whole trick: it returns every artifact
      # that exists in the run so far, and because this job only starts once
      # every lower level has finished, that set is exactly the levels below.
      # A level that needs nothing from this run simply finds nothing.
      - name: Download packages built earlier in this run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: pkg-*
          path: dl
          merge-multiple: true

      - name: Seed packages from this run
        run: |
          set -euo pipefail
          mkdir -p deps
          n=0
          for f in dl/*.tape.tar.gz; do
            [ -e "$f" ] || continue
            case $(basename "$f") in ${{ matrix.package }}-*) continue ;; esac
            tar xzf "$f" -C deps --strip-components=1 \
              --keep-directory-symlink --no-same-permissions --no-same-owner install
            n=$((n+1))
          done
          echo "seeded $n packages from level(s) below this one"

          # Above level 0 there is always something to seed -- that is what
          # being above level 0 means. Seeding nothing there means the download
          # step failed rather than found nothing, and it is allowed to fail
          # quietly because at level 0 finding nothing is correct.
          #
          # Without this assertion the two are indistinguishable, and the
          # dangerous outcome is not a confusing failure: it is a job that
          # builds against the published packages instead, SUCCEEDS, and ships
          # something built against stale versions of its own dependencies.
          if [ '${{ inputs.level }}' != '0' ] && [ "$n" -eq 0 ]; then
            echo "::error::level ${{ inputs.level }} seeded no packages from this run; the artifact download must have failed"
            exit 1
          fi

      # Paths that belong to the container runtime rather than to any package.
      #
      # duct-filesystem ships /dev, /proc, /sys and /etc/hosts, because a root
      # filesystem has them. Docker also bind-mounts /etc/hosts,
      # /etc/hostname and /etc/resolv.conf, and mounts /proc and /sys itself --
      # and a bind-mount target cannot be unlinked. Copying over them fails
      # with EBUSY ("Device or resource busy") or, for /sys, EROFS.
      #
      # Pruned here on the runner rather than in the container: deps/ is the
      # runner's directory and is mounted read-only on the other side.
      #
      # The local Makefile has done exactly this for as long as it has had a
      # dependency-unpacking step. CI never needed it until seeding started
      # running for builder images.
      - name: Prune runtime-owned paths from the seed
        run: |
          set -euo pipefail
          rm -rf deps/dev deps/proc deps/sys
          rm -f deps/etc/hosts deps/etc/hostname deps/etc/resolv.conf

      - name: Build
        run: |
          set -euo pipefail
          mkdir -p out sources deps
          # duct/bootstrap drops to an unprivileged "builder" user for package
          # builds, where every other build image runs as root. The mounted
          # output directory belongs to the runner, so without this the build
          # completes and then cannot write the package it just made.
          chmod 0777 out deps

          # "any" is a target tape understands; every other value is a triple.
          target='${{ matrix.arch }}'
          [ "$target" = any ] || target="$target-linux-gnu"
          echo "level ${{ inputs.level }}: building ${{ matrix.package }} for $target in ${{ matrix.image }}"

          # --entrypoint: duct/bootstrap runs tape-builder as its entrypoint, so
          # "bash -c ..." arrives as arguments to it -- "unknown command bash
          # for tape-builder". Every image here has /bin/bash; the Duct ones
          # reach it through the /bin -> usr/bin symlink.
          #
          # The container script is SINGLE-quoted and its inputs arrive as
          # environment variables. Double quotes would let the runner's shell
          # expand $f and $(basename ...) before the container ever saw them --
          # the same trap packages/Makefile documents at length after it handed
          # tar an empty filename.
          docker run --rm --entrypoint /bin/bash \
            -v "$PWD/pkgs":/pkgs:ro \
            -v "$PWD/out":/out \
            -v "$PWD/sources":/cache:ro \
            -v "$PWD/deps":/deps:ro \
            -e DUCT_SRC_CACHE=/cache \
            -e DUCT_JOBS="$(nproc)" \
            -e DUCT_PKG='${{ matrix.package }}' \
            -e DUCT_TARGET="$target" \
            '${{ matrix.image }}' \
            -c '
              set -euo pipefail

              if [ -d /deps/usr ]; then
                # --remove-destination unlinks each destination before opening
                # it. Without it, copying over a *running* binary fails with
                # ETXTBSY -- and /usr/bin/bash is running this very script.
                #
                # That is not a warning: the cp in these images is uutils cp,
                # which STOPS at the first error rather than carrying on like
                # GNU cp. One busy file therefore silently abandons the rest of
                # the copy, which is how a level that had correctly downloaded
                # and unpacked bc went on to fail with "bc: command not found"
                # several minutes later, pointing nowhere near the cause.
                #
                # packages/Makefile has carried the same flag, and the same
                # reasoning, since someone hit this locally:
                #
                #   overwriting a *running* binary in place fails with ETXTBSY,
                #   while cp --remove-destination unlinks the old inode and
                #   leaves running processes attached to it. That is what makes
                #   it safe to replace glibc and bash underneath the shell doing
                #   the replacing.
                cp -a --remove-destination /deps/. /

                # Assert the copy actually completed. set -e catches a cp that
                # reports failure; this catches one that half-succeeds, which is
                # the failure mode that cost the most time to find.
                missing=0
                for f in /deps/usr/bin/*; do
                  [ -e "$f" ] || continue
                  if [ ! -e "/usr/bin/$(basename "$f")" ]; then
                    echo "not copied: $f" >&2
                    missing=$((missing + 1))
                  fi
                done
                if [ "$missing" -ne 0 ]; then
                  echo "the dependency copy did not complete: $missing file(s) missing" >&2
                  exit 1
                fi

                # Nothing runs install hooks, so the cache is stale the moment
                # a library lands. Non-fatal: the loader falls back to searching
                # the directories in /etc/ld.so.conf, and not every image has
                # ldconfig at all.
                ldconfig 2>/dev/null || true
              fi

              cp -R /pkgs /tmp/pkgs
              exec tape-builder build "/tmp/pkgs/$DUCT_PKG" -t "$DUCT_TARGET" -o /out
            '
          ls -l out

      # if-no-files-found: error is not optional here, and it is easy to lose
      # in a refactor. Without it, a build that produced no package uploads an
      # empty artifact and the job goes GREEN -- and then every level above it
      # seeds nothing from that package and fails somewhere else entirely, for
      # a reason that looks nothing like "the build made nothing".
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.package }}-${{ matrix.arch }}
          path: out/*.tape.tar.gz
          if-no-files-found: error
          retention-days: 7
