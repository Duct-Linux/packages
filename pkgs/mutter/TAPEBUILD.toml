[package]
name = "mutter"
description = "GNOME window manager and Wayland compositor"
version = "48.4.0"
subversion = "1"
authors = ["The GNOME Project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
glib = ">=2.84.0"
gtk4 = ">=4.18.0"
gnome-desktop = ">=44.3.0"
gsettings-desktop-schemas = ">=48.0.0"
graphene = ">=1.10.2"
pango = ">=1.56.0"
cairo = ">=1.18.0"
pixman = ">=0.42.0"
harfbuzz = ">=10.0.0"
fribidi = ">=1.0.0"
libdrm = ">=2.4.118"
mesa = ">=25.0.0"
wayland = ">=1.23.1"
wayland-protocols = ">=1.41.0"
libinput = ">=1.28.0"
libxkbcommon = ">=1.7.0"
libdisplay-info = ">=0.2.0"
libgudev = ">=238.0.0"
eudev = ">=3.2.14"
elogind = ">=255.17.0"
libwacom = ">=2.16.0"
libcanberra = ">=0.30.0"
colord = ">=1.4.5"
lcms2 = ">=2.17.0"
pipewire = ">=1.4.0"
libei = ">=1.4.0"
at-spi2-core = ">=2.56.0"
startup-notification = ">=0.12.0"
xwayland = ">=24.1.0"
libX11 = ">=1.8.12"
libXext = ">=1.3.6"
libXfixes = ">=6.0.0"
libXdamage = ">=1.1.6"
libXcomposite = ">=0.4.6"
libXrandr = ">=1.5.4"
libXi = ">=1.8.2"
libXtst = ">=1.2.5"
libxcb = ">=1.17.0"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
gobject-introspection = ">=1.84.0"
glib-introspection = ">=2.84.1"
python = ">=3.13.0"
python-docutils = ">=0.21.2"
