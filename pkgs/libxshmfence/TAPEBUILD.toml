[package]
name = "libxshmfence"
description = "Shared-memory fences, the synchronisation primitive DRI3 is built on"
version = "1.3.3"
subversion = "1"
authors = ["The X.Org Foundation"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
# PKG_CHECK_MODULES(XPROTO, xproto) at configure.ac:100 -- headers only, and
# the reason this is a runtime dependency rather than a build one is that
# xorgproto is arch-independent and carries no code: nothing links it, but
# X11/Xfuncproto.h is included by the installed xshmfence.h, so a consumer of
# THIS package needs it present too.
xorgproto = ">=2024.1.0"

[dependencies.build]
pkgconf = ">=2.5.0"
# linux/futex.h, which --enable-futex requires. Declared because the flag is
# pinned rather than left on auto: without this the build stops on a missing
# header, which is the outcome the pin was chosen for, but a build dependency
# that is real should be named rather than inherited from the image.
linux-headers = ">=6.16.1"
