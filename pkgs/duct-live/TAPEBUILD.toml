[package]
name = "duct-live"
description = "PID 1, the boot scripts and the initramfs generator for a live Duct system"
version = "0.1.0"
# 2: the boot script starts udev, the D-Bus system bus, seatd and bluetoothd,
# and there is a graphical-session entry on tty1. The payload changed, so the
# identity has to.
# 3 -- the session's own output goes to /dev/console. On tty1 it went to a
# screen nobody watches (serial console) or under a compositor's framebuffer
# (no serial), so a boot test could see udev, the bus and seatd and not one
# line from the session itself.
# 4 -- the first gdm boot. Three things, all found by booting: gdm was started
# with --nodaemon, an option gdm 48 does not have, so it exited at once and
# tty1 went quiet; bluetoothd was started with --daemon, which it has never
# had, so the daemon this script exists to start had never once started; and
# elogind is now started here rather than left to D-Bus activation, because
# gdm gates its whole greeter on sd_seat_can_graphical(), which is a read of
# /run/systemd/seats and calls no D-Bus method at all. Plus a syslog sink, so
# that gdm -- which logs only through syslog(3) -- can be heard.
# 5 -- the tmpfiles.d rule this tree does not have. mutter creates
# /tmp/.X11-unix when it is missing and then rejects what it made, because
# mkdir(2) is umask-masked and the check it applies on the second of two
# consecutive calls demands the write bits back. gnome-shell died of signal 5
# on every spawn of the first greeter that ever ran here. The boot script now
# creates all four of systemd x11.conf's directories, with mkdir and chmod as
# separate commands.
subversion = "5"
authors = ["Duct"]
packagers = ["ItzYanick"]

# No source and no compiler: everything here is generated by install.sh from
# the files/ directory next to it, the way duct-filesystem is.
[install]
script = "install.sh"

# busybox is the hard one. It is PID 1 (through /usr/sbin/init), it is the
# archiver duct-mkinitramfs uses to build a cpio, and it is the entire userland
# inside the resulting initramfs. bash is what a person gets on the console;
# kmod is what loads a driver that is not built in; util-linux is what mounts
# things once the real root is up.
# WHAT IS DELIBERATELY NOT DECLARED, and it is most of what the boot script now
# starts: eudev, dbus, elogind, seatd, bluez and a compositor. Every one of them
# is guarded on its binary existing, because this package is what boots BOTH
# media -- a console ISO carries none of them and must stay that way. Declaring
# them would put a graphical stack on a medium whose whole point is not having
# one. The cost is that a missing one is silent by design; the boot script says
# which path it took, on the console, for exactly that reason.
[dependencies]
busybox = ">=1.37.0"
bash = ">=5.3.0"
kmod = ">=33.0.0"
util-linux = ">=2.41.1"
gzip = ">=1.14.0"
findutils = ">=4.10.0"

[dependencies.build]
