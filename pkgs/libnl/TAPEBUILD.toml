[package]
name = "libnl"
description = "Netlink protocol library suite, required by wpa_supplicant's nl80211 driver"
version = "3.11.0"
subversion = "1"
authors = ["Thomas Graf and contributors"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "../_scripts/install.sh"

[dependencies]
glibc = ">=2.42.0"

[dependencies.build]
# configure.ac calls PKG_CHECK_MODULES, and this recipe installs six .pc files.
pkgconf = ">=2.5.0"
# NOT OPTIONAL AND NOT OBVIOUS. The tarball ships lib/route/pktloc_syntax.y,
# pktloc_grammar.l, cls/ematch_syntax.y and cls/ematch_grammar.l and NONE of the
# generated .c files -- Makefile.am regenerates all four with $(YACC) and $(LEX)
# at build time (lines 347-366). libnl-route is built unconditionally, so there
# is no configure switch that avoids this.
#
# Undeclared, this is invisible locally and fatal in CI: a local `make repo`
# runs ALL_PKGS in sequence so flex and bison are already installed by accident,
# while CI seeds a level only from the levels below it. That is the exact failure
# check-recipes.sh's check_tool_dependencies docstring describes -- and that
# check could not have caught this one, because it reads meson find_program()
# calls and these are Makefile rules.
bison = ">=3.8.0"
flex = ">=2.6.4"
