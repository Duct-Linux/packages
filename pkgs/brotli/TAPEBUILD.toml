[package]
name = "brotli"
description = "Brotli compression library"
version = "1.1.0"
subversion = "1"
authors = ["Google"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-cmake.sh"

[install]
script = "../_scripts/install-cmake.sh"

[dependencies]
glibc = ">=2.42.0"

[dependencies.build]
cmake = ">=4.4.0"
ninja = ">=1.13.0"
