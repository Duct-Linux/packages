[package]
name = "firefox"
description = "Mozilla Firefox web browser"
version = "140.13.0"
subversion = "1"
authors = ["Mozilla"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"
[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
gcc = ">=15.2.0"
gtk3 = ">=3.24.0"
glib = ">=2.84.0"
cairo = ">=1.18.0"
pango = ">=1.56.0"
gdk-pixbuf = ">=2.42.0"
dbus = ">=1.16.0"
libX11 = ">=1.8.0"
libXcomposite = ">=0.4.6"
libXdamage = ">=1.1.6"
libXext = ">=1.3.6"
libXfixes = ">=6.0.1"
libXrandr = ">=1.5.4"
libxcb = ">=1.17.0"
alsa-lib = ">=1.2.0"

[dependencies.build]

