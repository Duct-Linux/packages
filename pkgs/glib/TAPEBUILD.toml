[package]
name = "glib"
description = "Low-level core library for GNOME"
version = "2.84.1"
subversion = "1"
authors = ["The GNOME Project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "build.sh"

[install]
script = "../_scripts/install-meson.sh"

[dependencies]
glibc = ">=2.42.0"
libffi = ">=3.4.8"
pcre2 = ">=10.45.0"
zlib = ">=1.3.1"
util-linux = ">=2.41.1"
gettext = ">=0.26.0"

[dependencies.build]
