[package]
name = "libsoup"
description = "HTTP client and server library, required by gnome-software"
version = "3.6.5"
subversion = "1"
authors = ["The GNOME Project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "../_scripts/install-meson.sh"

[dependencies]
glibc = ">=2.42.0"
glib = ">=2.84.0"
# All three are dependency() calls with no option guard.
sqlite = ">=3.50.4"
nghttp2 = ">=1.66.0"
libpsl = ">=0.21.5"
# -Dbrotli=enabled rather than auto, so this is a hard dependency by decision.
brotli = ">=1.1.0"
zlib = ">=1.3.1"
# THE TLS BACKEND. libsoup has none of its own -- it reaches TLS through glib's
# GTlsBackend. Declared as a runtime dependency for the obvious reason and as a
# BUILD dependency below for a less obvious one.
glib-networking = ">=2.80.1"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
gettext = ">=0.26.0"
# -Dintrospection=enabled makes this required rather than optional.
gobject-introspection = ">=1.84.0"
# NOT A MISTAKE, AND NOT A DUPLICATE OF THE RUNTIME ENTRY. -Dtls_check is left at
# its default of true, and meson.build then COMPILES AND RUNS a program calling
# g_tls_backend_supports_tls(). That needs a working TLS backend present AT
# BUILD TIME, not merely at run time -- so glib-networking has to be in the seed
# for this package to configure at all.
glib-networking = ">=2.80.1"
