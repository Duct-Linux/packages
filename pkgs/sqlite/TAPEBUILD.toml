[package]
name = "sqlite"
description = "Embedded SQL database engine, required by libsoup3"
version = "3.50.4"
subversion = "3"
authors = ["D. Richard Hipp and contributors"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "./build.sh"

[install]
script = "../_scripts/install.sh"

[dependencies]
glibc = ">=2.42.0"
zlib = ">=1.3.1"

[dependencies.build]
pkgconf = ">=2.5.0"
