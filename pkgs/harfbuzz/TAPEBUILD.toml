[package]
name = "harfbuzz"
description = "OpenType text shaping engine"
version = "11.0.0"
subversion = "1"
authors = ["The HarfBuzz project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "../_scripts/install-meson.sh"

[dependencies]
glibc = ">=2.42.0"
freetype = ">=2.13.3"
glib = ">=2.84.0"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
