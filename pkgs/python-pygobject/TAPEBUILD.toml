[package]
name = "python-pygobject"
description = "Python bindings for GObject-based libraries through introspection"
version = "3.52.3"
subversion = "1"
authors = ["The GNOME Project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
python = ">=3.13.0"
# girepository-2.0, which comes from GLIB rather than from gobject-introspection:
# glib 2.80 absorbed girepository, and this tree's glib package is what ships
# girepository-2.0.pc and libgirepository-2.0.so. Verified by listing the
# published artefacts of both packages, because the name says otherwise.
glib = ">=2.84.0"
libffi = ">=3.4.0"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
