[package]
name = "libarchive"
description = "Multi-format archive and compression library"
version = "3.8.1"
subversion = "2"
authors = ["Tim Kientzle and contributors"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

# Its own, to assert that the linked set matches the declared set. This recipe
# argues that the dependency list is the specification; the assertion is what
# makes that enforceable rather than aspirational. See install.sh.
[install]
script = "install.sh"

# THIS LIST IS THE SPECIFICATION, NOT A DESCRIPTION. libarchive's backends have
# no --with- flags; configure link-probes for each one and takes whatever it
# finds. So what is declared here is what gets seeded, which is what gets
# detected, which is what the shipped library can read. Under-declaring does not
# fail the build -- it produces a libarchive quietly missing a format. See
# pkg.env.
[dependencies]
glibc = ">=2.42.0"
zlib = ">=1.3.1"
bzip2 = ">=1.0.8"
xz = ">=5.8.1"
zstd = ">=1.5.7"
# BOUNDED, AND THE BOUND IS ABOUT THIS ARTEFACT RATHER THAN ABOUT UPSTREAM.
# openssl 3.5.7-2 (libcrypto.so.3) and 4.0.1-1 (libcrypto.so.4) are BOTH
# published with deleted_at null. tape resolves with Masterminds/semver and
# adds no range logic, so ">=3.5.0" is an open floor that selects the highest
# published major -- 4.0.1 -- while the published libarchive.so.13.8.1 carries
# DT_NEEDED libcrypto.so.3 on both arches, because CI seeds 3.5.7.
#
# THIS ONE RESOLVED CORRECTLY ANYWAY, AND THAT IS NOT A REASON TO LEAVE IT
# OPEN. libarchive -> libxml2 -> python, and python's constraint is bounded, so
# the resolver's diamond handling combined the two and picked 3.5.7 in every
# trial. The bound here was being supplied by a Python dependency of an XML
# library. Drop libxml2 -- an option this recipe's own configure notes discuss
# -- and libarchive silently becomes the broken case.
#
# The ceiling is not a claim that the source needs 3.x: measured against
# openssl 4.0.1 headers, configure selects the openssl digest backends and
# archive_digest.c, archive_hmac.c and archive_cryptor.c all compile clean.
# It is a claim about the binary this recipe produces, whose SONAME is fixed
# at build time. Moving to 4.x means a rebuild and a new bound, not a wider one.
openssl = ">=3.5.0,<4.0.0"
libxml2 = ">=2.13.0"
acl = ">=2.3.2"
attr = ">=2.5.2"
# pcre2 IS DELIBERATELY ABSENT, and this note is here because its absence looks
# like an oversight: pcre2's probe is UNGATED and pcre2 is packaged, so configure
# does find it, and an earlier version of this recipe declared it for that reason
# while recording that it was unverified.
#
# IT IS NOW MEASURED RATHER THAN ARGUED. The first build that ever completed
# printed, on BOTH architectures:
#     pcre2 is NOT linked despite being probed and present
# The CLI tools that would use it are disabled, so nothing pcre2 provides reaches
# libarchive.so. install.sh no longer permits libpcre2 in the linked set either,
# so if a future change does pull it in, the assertion fails rather than the
# declaration silently becoming load-bearing again.

[dependencies.build]
pkgconf = ">=2.5.0"
