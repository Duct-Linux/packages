[package]
name = "grub"
description = "The GRUB 2 bootloader, EFI platform"
version = "2.12.0"
subversion = "1"
authors = ["upstream"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "prepare.sh"

[build]
script = "build.sh"

[install]
script = "../_scripts/install.sh"

[dependencies]
glibc = ">=2.42.0"

[dependencies.build]
flex = ">=2.6.4"
bison = ">=3.8.2"
# grub's configure ends with "no suitable Python interpreter found" and stops.
# The tarball ships everything gentpl.py generates, so nothing here actually
# runs Python -- but the check is unconditional, and an unconditional check is
# a dependency whatever its author intended.
python = ">=3.13.7"
