[package]
name = "eudev"
description = "Device manager for the Linux kernel"
version = "3.2.14"
subversion = "2"
authors = ["The eudev project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "../_scripts/install.sh"

[dependencies]
glibc = ">=2.42.0"
kmod = ">=33.0.0"
util-linux = ">=2.41.1"

[dependencies.build]
pkgconf = ">=2.5.0"
# configure DIES without it -- "configure: error: *** gperf not found" -- so it
# is not optional and never was. It was absent from this list, which means
# nothing ordered eudev after gperf; the climb only worked because gperf
# happens to land at level 2 and eudev at level 4 for other reasons.
#
# An undeclared build tool is invisible to dep-levels.sh, so the ordering that
# saved us was a coincidence of the rest of the graph rather than a consequence
# of this dependency. Declaring it makes the edge real.
gperf = ">=3.1.0"
