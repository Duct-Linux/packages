[package]
name = "util-linux"
description = "Core Linux system utilities: mount, blkid, losetup, fdisk"
version = "2.41.1"
subversion = "1"
authors = ["upstream"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "../_scripts/install.sh"

[dependencies]
glibc = ">=2.42.0"
ncurses = ">=6.5.0"
zlib = ">=1.3.1"

[dependencies.build]
pkgconf = ">=2.5.1"
