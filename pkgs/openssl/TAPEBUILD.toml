[package]
name = "openssl"
description = "TLS and cryptography library"
version = "3.5.7"
subversion = "2"
authors = ["The OpenSSL Project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[build]
script = "build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
zlib = ">=1.3.1"
ca-certificates = ">=2026.7.16"

[dependencies.build]
perl = ">=5.42.0"
