[package]
name = "lcms2"
description = "Little CMS colour management engine"
version = "2.17.0"
subversion = "1"
authors = ["Marti Maria"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
zlib = ">=1.3.0"
libjpeg-turbo = ">=3.1.0"
libtiff = ">=4.7.0"

[dependencies.build]
pkgconf = ">=2.5.0"
