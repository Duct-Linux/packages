[package]
name = "rest"
description = "Helper library for RESTful web services"
version = "0.9.1"
subversion = "1"
authors = ["The GNOME Project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
glib = ">=2.84.0"
json-glib = ">=1.10.6"
libsoup = ">=3.6.5"
libxml2 = ">=2.13.0"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
gobject-introspection = ">=1.84.0"
glib-introspection = ">=2.84.1"
