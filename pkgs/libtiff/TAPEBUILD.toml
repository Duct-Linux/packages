[package]
name = "libtiff"
description = "TIFF image library"
version = "4.7.0"
subversion = "1"
authors = ["The libtiff maintainers"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "../_scripts/install.sh"

[dependencies]
glibc = ">=2.42.0"
zlib = ">=1.3.1"
libjpeg-turbo = ">=3.1.0"
xz = ">=5.8.1"

[dependencies.build]
