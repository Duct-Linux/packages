[package]
name = "elogind"
description = "Session and seat management daemon"
version = "255.17"
subversion = "1"
authors = ["The elogind project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "../_scripts/install-meson.sh"

[dependencies]
glibc = ">=2.42.0"
libcap = ">=2.76.0"
util-linux = ">=2.41.1"
linux-pam = ">=1.7.0"
acl = ">=2.3.2"
dbus = ">=1.16.2"
eudev = ">=3.2.14"

[dependencies.build]
python-jinja2 = ">=3.1.6"
gperf = ">=3.3.0"
meson = ">=1.8.2"
