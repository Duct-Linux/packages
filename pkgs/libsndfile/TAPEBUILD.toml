[package]
name = "libsndfile"
description = "Library for reading and writing sampled audio files"
version = "1.2.2"
subversion = "1"
authors = ["Erik de Castro Lopo"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
# ALL FIVE OF THESE ARE ONE DEPENDENCY, not five independent ones. configure.ac
# tests them as a concatenated string and drops every format on any single miss
# (see pkg.env). So there is no useful partial state to express here: either the
# whole group resolves or libsndfile ships as a WAV/AIFF-only library that still
# satisfies pulseaudio's `dependency('sndfile')` and still installs cleanly.
#
# libvorbis supplies TWO of the five probes -- vorbis.pc and vorbisenc.pc are
# separate pkg-config names from one package, and configure requires both by
# name -- which is why four entries cover five checks.
flac = ">=1.5.0"
libogg = ">=1.3.6"
libvorbis = ">=1.3.7"
opus = ">=1.5.2"

[dependencies.build]
pkgconf = ">=2.5.0"
