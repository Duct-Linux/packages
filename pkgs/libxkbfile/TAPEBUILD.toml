[package]
name = "libxkbfile"
description = "XKB keymap file and .xkm reader, shared by the X server and xkbcomp"
version = "1.1.3"
subversion = "1"
authors = ["The X.Org Foundation"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
# PKG_CHECK_MODULES(XKBFILE, x11 kbproto) at configure.ac:52 -- one call, both
# required, no fallback. kbproto comes from xorgproto.
libX11 = ">=1.8.12"
xorgproto = ">=2024.1.0"

[dependencies.build]
pkgconf = ">=2.5.0"
