[package]
name = "libXfont2"
description = "X server font engine, including the built-in fonts Xwayland starts on"
version = "2.0.7"
subversion = "1"
authors = ["The X.Org Foundation"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
# --enable-freetype, which is the rasteriser every format goes through --
# including the builtin PCF. PKG_CHECK_MODULES(FREETYPE, freetype2) at
# configure.ac 96-98, and the else-branch of that check ends in AC_MSG_ERROR.
freetype = ">=2.13.3"
# PKG_CHECK_MODULES(ZLIB, [zlib]) and X_GZIP_FONT_COMPRESSION, which is
# AC_DEFINE'd unconditionally at configure.ac:130 -- every bitmap font this
# library reads may be gzipped, and the builtin ones ARE.
zlib = ">=1.3.1"
# PKG_CHECK_MODULES(XFONT, [xproto xtrans fontsproto >= 2.1.3 fontenc]) at
# configure.ac:217, all four in one call with no fallback.
libfontenc = ">=1.1.8"
xorgproto = ">=2024.1.0"
xtrans = ">=1.6.0"

[dependencies.build]
pkgconf = ">=2.5.0"
