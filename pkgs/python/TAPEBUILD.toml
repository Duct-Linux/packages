[package]
name = "python"
description = "The Python programming language interpreter"
version = "3.13.7"
subversion = "5"
authors = ["upstream"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "install.sh"

# The optional-module dependencies are real: without zlib, bzip2 and xz the
# interpreter builds but cannot read the archive formats that half of Python's
# ecosystem assumes, and the failure appears at import time rather than here.
[dependencies]
glibc = ">=2.42.0"
zlib = ">=1.3.1"
bzip2 = ">=1.0.8"
xz = ">=5.8.1"
ncurses = ">=6.5.0"
# libffi is not an optional extra. Python builds the extension modules whose
# dependencies it can find and silently omits the rest, so without libffi there
# is no _ctypes and therefore no ctypes -- a gap that appears far from here, as
# a build script in another package dying on an import.
#
# openssl is here for the ssl module. It was absent for a while because Python
# 3.13's _ssl does not compile against OpenSSL 4.0; the distribution moved to
# 3.5 LTS and it does.
libffi = ">=3.4.8"
# Bounded, not an open floor. tape resolves with Masterminds/semver and adds no
# range logic, so ">=3.5.0" alone would admit 4.0.1 -- and published openssl
# 4.0.1 ships libssl.so.4 while 3.5.7 ships libssl.so.3. Resolution could then
# hand this package an openssl whose soname it cannot load, as a runtime failure
# at install time, displaced from the cause.
openssl = ">=3.5.0,<4.0.0"

[dependencies.build]
