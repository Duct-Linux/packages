[package]
name = "python"
description = "The Python programming language interpreter"
version = "3.13.7"
subversion = "3"
authors = ["upstream"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "install.sh"

# The optional-module dependencies are real: without zlib, bzip2 and xz the
# interpreter builds but cannot read the archive formats that half of Python's
# ecosystem assumes, and the failure appears at import time rather than here.
[dependencies]
glibc = ">=2.42.0"
zlib = ">=1.3.1"
bzip2 = ">=1.0.8"
xz = ">=5.8.1"
ncurses = ">=6.5.0"
# libffi is not an optional extra. Python builds the extension modules whose
# dependencies it can find and silently omits the rest, so without libffi there
# is no _ctypes and therefore no ctypes -- a gap that appears far from here, as
# a build script in another package dying on an import.
#
# openssl is deliberately NOT listed, and the ssl module is deliberately absent.
# Duct ships OpenSSL 4.0, and Python 3.13's _ssl.c does not compile against it:
# ASN1_OCTET_STRING and ASN1_IA5STRING became opaque, so every direct access to
# their fields is now "invalid use of incomplete typedef". This is a genuine
# upstream version incompatibility rather than a missing dependency, and the
# fix is a newer Python or an older OpenSSL, neither of which is this package's
# decision to make. See install.sh, which asserts what is present and says why
# ssl is not.
libffi = ">=3.4.8"

[dependencies.build]
