[package]
name = "ostree"
description = "Content-addressed filesystem store, flatpak's storage and transport layer"
# 2025.4.0, not upstream's 2025.4: tape's resolver needs three-component semver
# and SKIPS A PACKAGE SILENTLY otherwise. Same padding as libgpg-error's 1.55.0,
# and version_forms() in check-recipes tolerates the difference from the tarball
# name. A date-based version is exactly the shape that looks complete and is not.
version = "2025.4.0"
subversion = "2"
authors = ["Colin Walters and contributors"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
# Its own: ostree ships an absolute symlink that tape-repo cannot archive, and
# the failure lands in publish rather than in the build. See install.sh.
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
glib = ">=2.84.0"
curl = ">=8.13.0"
gpgme = ">=2.0.0"
# BOUNDED, AND THE BOUND IS ABOUT THIS ARTEFACT RATHER THAN ABOUT UPSTREAM.
# openssl 3.5.7-2 (libcrypto.so.3) and 4.0.1-1 (libcrypto.so.4) are BOTH
# published with deleted_at null. tape resolves with Masterminds/semver and
# adds no range logic, so ">=3.5.0" is an open floor that selects the highest
# published major -- 4.0.1 -- while every published ostree binary (ostree,
# rofiles-fuse, libostree-1.so.1.0.0, ostree-prepare-root) carries DT_NEEDED
# libcrypto.so.3 on both arches, because CI seeds 3.5.7.
#
# THIS ONE RESOLVED CORRECTLY ANYWAY, AND THAT IS NOT A REASON TO LEAVE IT
# OPEN. curl is in this recipe's own dependency list and curl's openssl
# constraint IS bounded, so the resolver's diamond handling combined the two
# and picked 3.5.7 in every trial. The bound was being supplied by a
# dependency declared here for HTTP, and it would have gone away with it.
# ostree-prepare-root is in the initramfs: this is the one binary in this
# package whose failure to load is an unbootable system rather than a failed
# command.
#
# The ceiling is not a claim that the source needs 3.x: ostree touches openssl
# only through EVP (digests and ed25519 sign/verify), and every symbol it calls
# compiles AND links against 4.0.1. It is a claim about the binaries this
# recipe produces, whose SONAME is fixed at build time. Moving to 4.x means a
# rebuild and a new bound, not a wider one.
openssl = ">=3.5.0,<4.0.0"
libarchive = ">=3.8.1"
xz = ">=5.8.1"
zlib = ">=1.3.1"
# revokefs and rofiles-fuse. flatpak needs fuse3 independently, so this adds no
# gate that was not already there.
fuse3 = ">=3.16.2"
# util-linux provides libmount, which ostree uses for its deployment logic.
util-linux = ">=2.41.1"

[dependencies.build]
pkgconf = ">=2.5.0"
bison = ">=3.8.2"
# BUILD-TIME ONLY, AND NEVER LINKED. configure has
#     PKG_CHECK_MODULES(OT_DEP_E2P, e2p)
# unconditionally, for a header it reads and a library it does not link. Without
# the .pc file configure fails outright, so this is a real requirement even
# though nothing in the shipped artefact references it.
e2fsprogs = ">=1.47.0"
