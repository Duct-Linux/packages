[package]
name = "pulseaudio"
description = "PulseAudio client libraries for applications that speak the PulseAudio protocol"
# 17.0.0, NOT 17.0, WHICH IS WHAT UPSTREAM CALLS IT. The tarball, the URL and
# SRC_DIR in pkg.env all say 17.0; only this field is padded, because tape's
# resolver requires three-component semver and SKIPS A PACKAGE SILENTLY when it
# cannot parse the version -- so the two-component spelling publishes fine,
# indexes fine, and then resolves for nobody. Same padding as
# adwaita-icon-theme, whose upstream is 48.0.
#
# Worth knowing HOW this was caught, because a build cannot see it: the recipe
# compiled, linked, asserted and packaged perfectly as "17.0" through several
# dry-build runs. The version is an identity rather than an input, so only
# tools/check-recipes.sh reports it. The build validates the recipe; the checker
# validates the identity, and they are not substitutes for each other.
version = "17.0.0"
subversion = "1"
authors = ["The PulseAudio developers"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
# The bare dependency() no option can drop -- meson.build:615, in the block
# common to client, daemon and modules, so -Ddaemon=false does not reach it.
# This is the edge the whole wave was built to satisfy.
libsndfile = ">=1.2.2"
# -Dglib=enabled, and the reason this package is in the tree at all:
# libpulse-mainloop-glib is built only inside `if glib_dep.found()`
# (src/pulse/meson.build:118). gnome-settings-daemon requires that library.
glib = ">=2.84.0"
# -Ddbus=enabled. Verified against DT_NEEDED on the staged payload rather than
# taken from the dependency() list: libpulsecommon links libdbus-1 directly, so
# the client carries a real D-Bus edge even with the daemon gone.
dbus = ">=1.16.2"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
# `m4 = find_program('m4', required: true)` at meson.build:901 -- INSIDE the
# `if get_option('client')` block, so -Ddaemon=false does not remove it. It is
# not a leftover: the CMake config files this package installs are generated by
# running m4 over PulseAudioConfig.cmake.in. Hard-required, so a builder image
# without m4 fails at configure rather than shipping a smaller package.
#
# There is a second find_program in this file, at line 2:
# `run_command(find_program('git-version-gen'), ...)`, also required by default.
# It needs nothing declared -- git-version-gen is a script SHIPPED IN THE
# TARBALL ROOT (checked, 6458 bytes, executable), not a program from PATH.
# Recorded so the next reader does not go looking for a package to declare.
m4 = ">=1.4.20"
# INVISIBLE TO tools/check-recipes.sh, which is why it is written here with a
# reason rather than left to be discovered. po/meson.build calls
# `i18n.gettext(...)`, a meson MODULE invocation -- it needs msgfmt and msgmerge
# from gettext and contains no find_program() for the scanner to see. The
# translations are built under `if get_option('client')`, which is the half of
# this package that is enabled.
gettext = ">=0.26.0"
