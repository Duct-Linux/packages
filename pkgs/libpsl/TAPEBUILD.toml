[package]
name = "libpsl"
description = "Public Suffix List library, used by libsoup for cookie domain checks"
version = "0.21.5"
subversion = "1"
authors = ["Tim Ruehsen and contributors"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "../_scripts/install.sh"

[dependencies]
glibc = ">=2.42.0"

[dependencies.build]
pkgconf = ">=2.5.0"
# The built-in PSL data is generated by a python script at build time.
python = ">=3.13.0"
