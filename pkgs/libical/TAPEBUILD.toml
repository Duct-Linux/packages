[package]
name = "libical"
description = "iCalendar protocol implementation and its libical-glib GObject binding"
version = "3.0.20"
# 2: tzdata added to [dependencies] when -DUSE_BUILTIN_TZDATA flipped to False.
# [dependencies] reaches TAPEPACKAGE.toml, so without this bump the publish
# would see an identity it has already indexed, keep the old manifest, and ship
# a libical whose timezones come from a package nothing pulls in.
subversion = "2"
authors = ["The libical Developers"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-cmake.sh"

[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
# libical_cxx and libicalss_cxx (-DWITH_CXX_BINDINGS=True) link libstdc++.
gcc = ">=15.2.0"
# libical-glib links libglib-2.0 and libgobject-2.0; the binding is the whole
# point of the package.
glib = ">=2.84.0"
# NOT a build-only dependency, which is where reading the build file alone puts
# it. libxml2 is used by ical-glib-src-generator, the code generator that turns
# src/libical-glib/api/*.xml into C -- and src/libical-glib/CMakeLists.txt:14-18
# INSTALLS that generator to /usr/libexec/libical, so a shipped binary carries
# DT_NEEDED libxml2.so. Set from readelf over the staged tree rather than from
# the dependency() list, and the two disagree here.
libxml2 = ">=2.13.0"
# Nothing selects this and nothing can turn it off: find_package(ICU) at
# CMakeLists.txt:214 is unconditional, icu is published, and CI seeds every
# published package -- so libical links libicui18n and libicuuc for RSCALE
# (RFC 7529) support whether or not anyone chose it. Declared because the
# artefact links it, and asserted in install.sh so the autodetection cannot
# silently stop happening.
icu = ">=77.1.0"
# THE ZONES THEMSELVES, and this is a runtime dependency on DATA rather than on
# a library -- nothing here links it and no build step reads it, so no linkage
# check and no build could ever discover it. With -DUSE_BUILTIN_TZDATA=False
# libical takes every timezone from the first of four hardcoded directories
# holding a zone.tab (icaltz-util.c:104-109), and tzdata is what puts one
# there. Without it installed, libical resolves NO timezone and nothing fails.
tzdata = ">=2025.2.0"

[dependencies.build]
cmake = ">=4.4.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
# find_package(Perl REQUIRED) at CMakeLists.txt:193. Every derived header and
# implementation in src/libical is generated by scripts/mkderived*.pl from the
# CSV files in design-data; there is no pre-generated copy in the tarball.
perl = ">=5.42.0"
# -DGOBJECT_INTROSPECTION=True. g-ir-scanner and g-ir-compiler produce
# ICalGLib-3.0.gir and .typelib; nothing built here links libgirepository.
gobject-introspection = ">=1.84.0"
# The scanner reads GObject-2.0.gir and GLib-2.0.gir off disk to resolve the
# gir's own INCLUDES (src/libical-glib/CMakeLists.txt:160), and those files
# come from this package rather than from glib. An exec-time build dependency
# no linkage check can see.
glib-introspection = ">=2.84.0"
