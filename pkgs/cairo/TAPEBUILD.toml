[package]
name = "cairo"
description = "2D vector graphics library"
version = "1.18.4"
subversion = "2"
authors = ["The cairo project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "../_scripts/install-meson.sh"

[dependencies]
glibc = ">=2.42.0"
pixman = ">=0.44.2"
freetype = ">=2.13.3"
fontconfig = ">=2.16.0"
libpng = ">=1.6.47"
glib = ">=2.84.0"
zlib = ">=1.3.1"
# -Dxlib=enabled. The three X client libraries cairo's xlib surface links, and
# the reason this recipe carries a subversion bump: [dependencies] reaches
# TAPEPACKAGE.toml, and cairo 1.18.4-1 is already published.
#
# Enabled for mutter-x11-frames by way of gtk4's X11 backend -- see pkg.env.
# All three are in GRAPHICS_PKGS, which precedes this group, so the ordering
# needs nothing new.
libX11 = ">=1.8.10"
libXext = ">=1.3.6"
libXrender = ">=0.9.11"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
