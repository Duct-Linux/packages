[package]
name = "cairo"
description = "2D vector graphics library"
version = "1.18.4"
subversion = "1"
authors = ["The cairo project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "../_scripts/install-meson.sh"

[dependencies]
glibc = ">=2.42.0"
pixman = ">=0.44.2"
freetype = ">=2.13.3"
fontconfig = ">=2.16.0"
libpng = ">=1.6.47"
glib = ">=2.84.0"
zlib = ">=1.3.1"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
