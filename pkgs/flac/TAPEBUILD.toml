[package]
name = "flac"
description = "Free Lossless Audio Codec library and command line tools"
version = "1.5.0"
subversion = "1"
authors = ["Xiph.Org Foundation"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
# Ogg-FLAC. This edge is the whole reason the recipe passes --enable-ogg
# explicitly and asserts the result: libogg missing at configure time is a
# WARNING, so an undeclared or unbuilt libogg produces a green flac with no Ogg
# container support, and libsndfile then drops its ENTIRE xiph group over it.
libogg = ">=1.3.6"

# NO pkgconf. configure.ac has no PKG_PROG_PKG_CONFIG, no PKG_CHECK_MODULES and
# no PKG_INSTALLDIR -- libogg is found by a hand-written header/library probe in
# m4/ogg.m4, and flac.pc is generated by autoconf substitution. Stated because
# every neighbouring recipe declares pkgconf and its absence here would
# otherwise read as an omission.
