[package]
name = "linux"
description = "The Linux kernel, its modules and its device trees"
version = "6.16.1"
subversion = "2"
authors = ["upstream"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "build.sh"

[install]
script = "install.sh"

# Nothing at runtime. The kernel is the thing everything else runs on top of;
# it links against no library and calls no program. kmod is what reads the
# modules this package installs, but the kernel does not need kmod to boot --
# an initramfs that loads no modules never invokes it -- so it is a dependency
# of the live system rather than of the kernel.
[dependencies]

[dependencies.build]
bc = ">=1.08.2"
elfutils = ">=0.193.0"
perl = ">=5.42.0"
# certs/extract-cert links against libcrypto. It is built whenever
# CONFIG_SYSTEM_TRUSTED_KEYRING is set, which arm64's defconfig sets by way of
# CONFIG_INTEGRITY -- so this is a dependency even though Duct signs no
# modules.
#
# ">=4.0.1" UNTIL NOW, WHICH NOTHING IN THIS TREE COULD SATISFY. The tree
# packages openssl 3.5.7 (repinned from 4.0.1 when python's _ssl and curl both
# failed to compile against 4.0 -- see pkgs/openssl/pkg.env), so this asked for
# a version no recipe here builds. It was satisfiable only by openssl 4.0.1-1,
# a package still being SERVED from the index but no longer built from this
# tree.
#
# Nothing reported it, and nothing would have: check_dependencies() in
# tools/check-recipes.sh does `table.pop("build")` and then verifies only that
# each build dependency NAMES a real recipe -- build-dependency CONSTRAINTS are
# never compared against anything. CI did not report it either, because the
# seed step has no constraint logic at all: it untars every published package
# and the build takes whatever lands. So this line was documentation that
# disagreed with the tree, in the one place nothing checks.
#
# Bounded to the packaged series for the same reason as every other openssl
# consumer here: it names what this package is actually built against.
openssl = ">=3.5.0,<4.0.0"
flex = ">=2.6.4"
bison = ">=3.8.2"
kmod = ">=33.0.0"
pkgconf = ">=2.5.1"
