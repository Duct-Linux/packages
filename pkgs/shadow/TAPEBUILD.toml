[package]
name = "shadow"
description = "Password and account management utilities"
version = "4.17.4"
subversion = "1"
authors = ["upstream"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
libxcrypt = ">=4.4.38"
linux-pam = ">=1.7.0"
acl = ">=2.3.2"
attr = ">=2.5.2"

[dependencies.build]
pkgconf = ">=2.5.0"
