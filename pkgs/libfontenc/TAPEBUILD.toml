[package]
name = "libfontenc"
description = "X font encoding tables"
version = "1.1.8"
subversion = "1"
authors = ["The X.Org Foundation"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
# AC_CHECK_LIB(z, gzclose) at configure.ac:57, and it is AC_MSG_FAILURE on
# absence rather than a soft skip -- libfontenc reads gzipped .enc files.
zlib = ">=1.3.1"
# PKG_CHECK_MODULES(FONTENC, xproto): headers only, but the installed
# X11/fonts/fontenc.h includes them, so a consumer needs them too.
xorgproto = ">=2024.1.0"

[dependencies.build]
pkgconf = ">=2.5.0"
