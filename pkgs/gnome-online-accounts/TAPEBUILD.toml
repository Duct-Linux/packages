[package]
name = "gnome-online-accounts"
description = "Single sign-on framework for GNOME online account providers"
version = "3.54.5"
subversion = "1"
authors = ["The GNOME Project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "./install.sh"

[dependencies]
glibc = ">=2.42.0"
glib = ">=2.84.0"
dbus = ">=1.16.2"
json-glib = ">=1.10.6"
libsecret = ">=0.21.7"
libsoup = ">=3.6.5"
libxml2 = ">=2.13.0"
gtk4 = ">=4.18.0"
libadwaita = ">=1.7.0"
# rest-1.0, and the reason it is packaged in this same change. meson.build:130
# takes it with `fallback: ['librest', 'librest_dep']` -- and every recipe here
# inherits --wrap-mode=nodownload, so that fallback is a hard configure failure
# rather than a vendored copy. It has to exist first.
rest = ">=0.9.1"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
gobject-introspection = ">=1.84.0"
glib-introspection = ">=2.84.1"
gettext = ">=0.26.0"
