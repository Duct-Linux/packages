[package]
name = "rust"
description = "The Rust programming language toolchain"
version = "1.97.1"
subversion = "4"
authors = ["The Rust Project Developers"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[build]
script = "build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
gcc = ">=15.2.0"
zlib = ">=1.3.1"
# cargo links against libssl and libcrypto. Without this the package installs
# happily and then cargo cannot start: "libssl.so.3: cannot open shared object
# file". rustc itself is fine, which is what makes it easy to miss.
#
# The constraint has to move with the pin, not merely be loosened: tape reads
# ">=3.5.0" as >=3.5.0, <3.6.0, so the old ">=4.0.0" would have admitted
# nothing at all against a 3.5 package rather than quietly still matching.
# Bounded, not an open floor. tape resolves with Masterminds/semver and adds no
# range logic, so ">=3.5.0" alone would admit 4.0.1 -- and published openssl
# 4.0.1 ships libssl.so.4 while 3.5.7 ships libssl.so.3. Resolution could then
# hand this package an openssl whose soname it cannot load, as a runtime failure
# at install time, displaced from the cause.
openssl = ">=3.5.0,<4.0.0"

[dependencies.build]
cmake = ">=4.0.0"
ninja = ">=1.13.0"
python = ">=3.13.0"
pkgconf = ">=2.5.0"
