[package]
name = "rust"
description = "The Rust programming language toolchain"
version = "1.97.1"
subversion = "1"
authors = ["The Rust Project Developers"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[build]
script = "build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
gcc = ">=15.2.0"
zlib = ">=1.3.1"

[dependencies.build]
cmake = ">=4.0.0"
ninja = ">=1.13.0"
python = ">=3.13.0"
