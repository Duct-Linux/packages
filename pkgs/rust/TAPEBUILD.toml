[package]
name = "rust"
description = "The Rust programming language toolchain"
version = "1.97.1"
subversion = "2"
authors = ["The Rust Project Developers"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[build]
script = "build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
gcc = ">=15.2.0"
zlib = ">=1.3.1"
# cargo links against libssl and libcrypto. Without this the package installs
# happily and then cargo cannot start: "libssl.so.4: cannot open shared object
# file". rustc itself is fine, which is what makes it easy to miss.
openssl = ">=4.0.0"

[dependencies.build]
cmake = ">=4.0.0"
ninja = ">=1.13.0"
python = ">=3.13.0"
