[package]
name = "sassc"
description = "Command-line Sass stylesheet compiler"
version = "3.6.2"
subversion = "1"
authors = ["The Sass team"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[build]
script = "build.sh"

[install]
script = "install.sh"

[dependencies]
glibc = ">=2.42.0"
libsass = ">=3.6.6"

[dependencies.build]
pkgconf = ">=2.5.0"
