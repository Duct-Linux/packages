[package]
name = "mesa"
description = "OpenGL, EGL and GBM implementation"
version = "25.0.7"
subversion = "1"
authors = ["The Mesa 3D Graphics Library contributors"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "build.sh"

[install]
script = "../_scripts/install-meson.sh"

[dependencies]
glibc = ">=2.42.0"
libdrm = ">=2.4.124"
expat = ">=2.7.1"
zlib = ">=1.3.1"
wayland = ">=1.23.1"
llvm = ">=20.1.8"
eudev = ">=3.2.14"
util-linux = ">=2.41.1"

[dependencies.build]
meson = ">=1.8.2"
ninja = ">=1.13.0"
python-mako = ">=1.3.10"
wayland-protocols = ">=1.41"
bison = ">=3.8.2"
flex = ">=2.6.4"
