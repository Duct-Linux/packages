[package]
name = "libxcvt"
description = "VESA Coordinated Video Timing calculation library"
version = "0.1.3"
subversion = "1"
authors = ["The X.Org Foundation"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "install.sh"

[dependencies]
# libc and nothing else. libxcvt was split out of the X server precisely so
# that computing a mode line would not require linking one.
glibc = ">=2.42.0"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
