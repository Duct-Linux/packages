[package]
name = "gobject-introspection"
description = "GObject introspection metadata and scanner"
version = "1.84.0"
subversion = "1"
authors = ["The GNOME Project"]
packagers = ["ItzYanick"]

[source]
script = "../_scripts/fetch.sh"

[prepare]
script = "../_scripts/prepare.sh"

[build]
script = "../_scripts/build-meson.sh"

[install]
script = "../_scripts/install-meson.sh"

[dependencies]
glibc = ">=2.42.0"
glib = ">=2.84.0"
libffi = ">=3.4.8"
python = ">=3.13.0"

[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"
python-setuptools = ">=80.9.0"
python-mako = ">=1.3.0"
