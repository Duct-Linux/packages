[package]
name = "gtksourceview"
description = "gtksourceview support for GNOME applications"
version = "5.16.0"
subversion = "1"
authors = ["Upstream authors"]
packagers = ["ItzYanick"]
[source]
script = "../_scripts/fetch.sh"
[prepare]
script = "../_scripts/prepare.sh"
[build]
script = "../_scripts/build-meson.sh"
[install]
script = "../_scripts/install-meson.sh"
[dependencies]
glibc = ">=2.42.0"
[dependencies.build]
meson = ">=1.8.0"
ninja = ">=1.13.0"
pkgconf = ">=2.5.0"

